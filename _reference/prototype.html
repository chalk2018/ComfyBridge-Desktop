/* ================= ComfyUI 执行 · 排队规则 =================
   照真实 ComfyUI 的行为模拟：同一时刻只跑一个任务。
   · 普通生成（发送 / 再来一张 / 重试）：有任务在跑 → 只提示、不执行、也不进队列。
   · 队列生成（加入队列生成）：只在"没有普通任务没跑完"时才能加；加完能接着加，一个一个跑。
*/
const EXEC = { job:null, run:null, timer:null };
let _runSeq = 0;

function allRuns(){
  const out = [];
  (S.jobs||[]).forEach(j=>(j.runs||[]).forEach(r=>out.push({j,r})));
  return out;
}
function runningEntry(){ return allRuns().find(x=>x.r.state==='running') || null; }
function queuedEntries(){ return allRuns().filter(x=>x.r.state==='queued').sort((a,b)=>(a.r.seq||0)-(b.r.seq||0)); }
function pendingNormal(){ return allRuns().find(x=>x.r.mode!=='queue' && (x.r.state==='queued'||x.r.state==='running')) || null; }

function busyText(x){
  const cap = S.capabilities.find(c=>c.id===x.j.cap);
  const nm = (cap?cap.name:x.j.capName) + ' · ' + (x.r.grade||'默认');
  const tail = x.r.state==='running' ? (Math.round(x.r.pct||0)+'%') : '刚提交还没开始';
  return `「${nm}」（${tail}）`;
}
function toastBlocked(title, detail, ms=4400){
  $$('.tblock').forEach(e=>e.remove());
  const el = document.createElement('div');
  el.className = 'tblock';
  el.innerHTML = `<div class="tb-i">⏳</div><div class="tb-t"><b>${esc(title)}</b><span>${esc(detail)}</span></div>`;
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),260); }, ms);
}

function guardNormal(){
  if(!UI.comfyOnline){ toast('ComfyUI 没连上，先把它打开'); return false; }
  const busy = runningEntry();
  if(busy){
    toastBlocked('正在生成中', busyText(busy)+' 还没跑完。等这张出来再点；想要同一张的高清版，用下面的「加入队列生成」。');
    return false;
  }
  return true;
}
function guardQueue(){
  if(!UI.comfyOnline){ toast('ComfyUI 没连上，先把 ComfyUI 启动起来'); return false; }
  const p = pendingNormal();
  if(p){
    toastBlocked('先等这张出来', busyText(p)+' 还在跑。它出来以后再点「加入队列生成」，不然你现在等的这张会排在后面。');
    return false;
  }
  // 排队上限写在配置文件里（service.maxQueue），页面上不给改
  const cap = Math.max(1, +(S.service.maxQueue) || 20);
  const qn = queuedEntries().filter(x=>x.j && x.j.id !== UI.qJobId).length;
  if(qn >= cap){
    toastBlocked('排队已满', `已经排了 ${qn} 个（最多 ${cap} 个）。等前面出来几个再加。`);
    return false;
  }
  return true;
}

function newRun(job, mode, wfName, gradeName, media){
  // 一批只有一个种子：首发随机生成，之后所有队列任务都沿用它
  if(!job.seed) job.seed = Math.floor(Math.random()*1e9);
  return {
    id: uid('run'), seq: ++_runSeq, mode, wf:wfName, grade:gradeName||'',
    seed: job.seed, media,
    state:'queued', pct:0, t0:Date.now(),
    stem: (job.prompt||'成品').replace(/[\\/:*?"<>|\s，。、；：！？]/g,'_').slice(0,10)
  };
}

/* 普通生成：首发的那一张 */
function submitNormal(capId, prompt, gradeName, wfName, refs){
  if(!guardNormal()) return false;
  const cap = S.capabilities.find(c=>c.id===capId) || currentCap();
  if(!cap) return false;
  const wf = (cap.workflows||[]).find(w=>w.name===wfName) || { output:{kind:'图片'} };
  const okind = (wf.output && wf.output.kind) || '图片';
  const media = okind==='视频' ? 'video' : okind==='音频' ? 'audio' : 'image';
  const job = { id:uid('job'), cap:capId, capName:cap.name, wf:wfName, prompt, refs:refs||[], t0:Date.now(), runs:[] };
  job.runs.push(newRun(job, 'normal', wfName, gradeName, media));
  S.jobs.push(job);
  saveState();
  UI.autoScroll = true;
  pump();
  render();
  return true;
}

/* 队列生成：接到同一张卡的后面 */
function addQueueRun(job, gradeName){
  const base = jobRuns(job)[0];
  if(!base) return;
  // 同一个种子、换一档参数：出来的是同一张构图的高清版，不是另画一张
  const run = newRun(job, 'queue', base.wf, gradeName, base.media);
  job.runs.push(run);
  saveState();
  const ahead = queueAhead(run);
  const idx = doneRuns(job).length + pendRuns(job).length;
  renderCard(job);
  pump();
  renderDrawer();
  toast(ahead>0 ? `已加入队列：前面还有 ${ahead} 个，跑完接到成品 ${idx}` : `开跑了，出的片会接到成品 ${idx}`, 2600);
}

function pump(){
  if(EXEC.run) return;
  const next = queuedEntries()[0];
  if(!next) return;
  startRun(next.j, next.r);
}

function startRun(job, run){
  EXEC.job = job; EXEC.run = run;
  run.state = 'running'; run.pct = 1; run.t0 = Date.now();
  saveState();
  renderCard(job); renderDrawer();
  const dur = runDurMs(job, run);
  const t0 = Date.now();
  clearInterval(EXEC.timer);
  EXEC.timer = setInterval(()=>{
    if(run.state!=='running'){ clearInterval(EXEC.timer); EXEC.timer=null; return; }
    const p = Math.min(100, ((Date.now()-t0)/dur)*100);
    if(p>=100){ clearInterval(EXEC.timer); EXEC.timer=null; finishRun(job, run); return; }
    if(p > (run.pct||0)){ run.pct = p; paintRun(job, run); }
  }, 240);
}

function finishRun(job, run){
  run.state = 'done'; run.pct = 100; run.t1 = Date.now();
  const idx = doneRuns(job).length;   // 含自己
  const ext = run.media==='video' ? 'mp4' : run.media==='audio' ? 'wav' : 'png';
  run.file = run.stem + '_' + String(idx).padStart(4,'0') + '_.' + ext;
  if(EXEC.run===run){ EXEC.run = null; EXEC.job = null; }
  saveState();
  renderCard(job); renderDrawer();
  const cap = S.capabilities.find(c=>c.id===job.cap);
  if(run.mode==='queue'){
    toast(`队列里的「${run.grade||'默认'}」出来了，已接到成品 ${idx}`, 2800);
  }else{
    toast('生成完成，已存到「'+S.service.archiveDir+'/'+(cap?cap.name:'')+'/」', 2600);
  }
  pump();
}

function cancelJob(job){
  const r = jobRuns(job).find(x=>x.state==='running'||x.state==='queued');
  if(!r) return;
  r.state = 'canceled';
  if(EXEC.run===r){ clearInterval(EXEC.timer); EXEC.timer=null; EXEC.run=null; EXEC.job=null; }
  saveState(); render(); pump();
}

/* 图片/视频/音频在"同一批"这句话里说法不同，别对着音频说"同一张" */
function batchWording(media){
  if(media==='video') return { same:'同一条', better:'更清晰' };
  if(media==='audio') return { same:'同一段', better:'音质更好' };
  return { same:'同一张', better:'更精细' };
}

/* 成品角上写这一档实际的尺寸，比重复写种子有用（一批只有一个种子） */
function runSizeText(job, run){
  const cap = S.capabilities.find(c=>c.id===job.cap);
  const wf = cap && (cap.workflows||[]).find(w=>w.name===run.wf);
  const g = wf && (wf.grades||[]).find(x=>x.name===run.grade);
  if(!g) return run.grade||'默认';
  const p = gradeParams(wf, g) || {};
  if(p.width && p.height) return p.width+'×'+p.height;
  if(p.seconds) return p.seconds+' 秒';
  return (g.name||run.grade||'默认');
}

function renderCard(job){
  const el = document.getElementById(job.id);
  if(!el) return;
  el.outerHTML = jobCard(job);
  bindStudio();
}
function paintRun(job, run){
  const card = document.getElementById(job.id);
  const pct = Math.round(run.pct||0);
  if(card){
    const st = stepTotal(job, run);
    card.querySelectorAll('[data-jobbar]').forEach(e=>e.style.width = pct+'%');
    card.querySelectorAll('[data-jobpct]').forEach(e=>e.textContent = pct+'%');
    card.querySelectorAll('[data-jobstep]').forEach(e=>e.textContent = `正在采样 · ${Math.round(pct*st/100)}/${st} 步`);
    card.querySelectorAll('[data-runprog="'+run.id+'"] i').forEach(e=>e.style.width = pct+'%');
    card.querySelectorAll('[data-runpct="'+run.id+'"]').forEach(e=>e.textContent = pct+'%');
    card.querySelectorAll('[data-runstep="'+run.id+'"]').forEach(e=>e.textContent = `正在采样 · ${Math.round(pct*st/100)}/${st} 步`);
  }
  const dr = document.querySelector('[data-drawerpct="'+run.id+'"]');
  if(dr) dr.textContent = pct+'%';
}

/* 「加入队列生成」的确认框：挑一档 + 一个随机种子 */
function openQueueModal(jobId){
  const j = S.jobs.find(x=>x.id===jobId);
  if(!j) return;
  if(!guardQueue()) return;
  const cap = S.capabilities.find(c=>c.id===j.cap);
  const base = jobRuns(j)[0];
  const wf = (cap.workflows||[]).find(w=>w.name===base.wf) || (cap.workflows||[])[0];
  const grades = (wf && wf.grades) || [];
  if(!grades.length){ toast('这个工作流还没有档位，先去管理台加一档'); return; }
  const pick0 = grades[grades.length-1];
  const dnum = doneRuns(j).length;
  const qn = queuedEntries().length;
  const running = runningEntry();
  const w = batchWording(base.media);
  const html = `<div class="m-head"><h3>加入队列生成</h3><button class="btn ghost sm" data-close>✕</button></div>
  <div class="m-body">
    <div class="qintro">挑一档，出${w.same}的${w.better}版。种子不变，已有的成品一张不动，新的接在<b>成品 ${dnum+1}</b>。</div>
    <div class="qlabel">用哪一档</div>
    <div class="qgrades">
      ${grades.map(g=>`<div class="qg ${g.name===pick0.name?'on':''}" data-qg="${esc(g.name)}">
        <span class="qg-n">${esc(g.name)}</span>
        <span class="qg-d">${esc(gradeDetail(g, wf.fields, wf) || g.note || '')}</span>
        <span class="qg-t">约 ${Math.max(2,Math.round(runDurMs(j, {wf:base.wf, grade:g.name})/1000))} 秒</span>
      </div>`).join('')}
    </div>
    <div class="qrow">
      <span class="qn">种子</span>
      <span class="qseed">${j.seed||base.seed}</span>
      <span class="tiny muted">跟这张一样，只是更细</span>
    </div>
    <div class="qstat">${running
      ? `正在跑${busyText(running)}，这一档排在它后面`
      : (qn ? `前面排了 ${qn} 个，这是第 ${qn+1} 个` : '现在空着，点确认就开始')} · 一次只跑一个</div>
  </div>
  <div class="m-foot">
    <span class="tiny muted" style="flex:1">可以连着加，一个一个跑</span>
    <button class="btn sm" data-close>取消</button>
    <button class="btn sm primary" id="qGo">加入队列生成</button>
  </div>`;
  UI.qJobId = j.id;
  const mask = openModal(html);
  let sel = pick0.name;
  $$('[data-qg]', mask).forEach(el=>el.onclick=()=>{
    sel = el.dataset.qg;
    $$('[data-qg]', mask).forEach(x=>x.classList.toggle('on', x===el));
  });
  $('#qGo', mask).onclick = ()=>{
    closeModal();
    if(!guardQueue()) return;
    addQueueRun(j, sel);
  };
}

function doSend(){

/* ---- 档位表（核心页面） ---- */
// 这一页只干一件事：把一个工作流拆成"默认档 + 若干改过的拷贝档"。
//   左列 ① 工作流文件 ② 参数节点（勾哪些进设置） ③ 被排除的节点（说明为什么不让设）
//   ④ 新档位区：勾好的参数在这里填一组值 + 档位名 + 【添加】
//         点【添加】= 把原始工作流深拷贝一份，这批值写进拷贝，拷贝就是这一档要调的工作流
//   ⑤ 档位列表：一行一档，第一行永远是"默认档 = 原始工作流"（只读、删不掉）；
//      其余每行 ✎ 编辑 = 展开这一档那份拷贝的全部参数
// 控件形态跟着参数本身的类型走：数字→输入框，开关→开关，枚举→下拉，多选→多选。

/* 一格参数渲染成对应控件 */
function ctlHtml(field, value, attr, opt){
  opt = opt || {};
  const kind = controlOf(field);
  const meta = fieldMeta(field);
  const dis = opt.disabled ? 'disabled' : '';
  const ph = opt.placeholder || '';
  const a = attr ? `${attr}="${attr.split('@')[0].replace('@','|')}"` : '';
  const v = value===undefined || value===null ? '' : value;
  if(kind==='switch'){
    const on = v===true || v==='true' || v===1;
    return `<span class="sw ${on?'on':''} ${dis}" ${attr} data-switch="1" role="switch" aria-checked="${on}"><i></i><em>${on?'开':'关'}</em></span>`;
  }
  if(kind==='select'){
    const opts = fieldOpts(field);
    const cur = String(v);
    const list = opts.includes(cur) ? opts : (cur!=='' ? [cur].concat(opts) : opts);
    return `<select class="input" ${attr} ${dis}>${list.map(o=>`<option value="${esc(o)}" ${String(o)===cur?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  }
  if(kind==='multi'){
    const opts = fieldOpts(field);
    const cur = Array.isArray(v) ? v.map(String) : (v?String(v).split(',').map(x=>x.trim()).filter(Boolean):[]);
    const list = [...new Set([...opts, ...cur])];
    return `<span class="multi ${dis}" ${attr}>${list.map(o=>`<label class="mopt"><input type="checkbox" value="${esc(o)}" ${cur.includes(String(o))?'checked':''} ${dis}><span>${esc(o)}</span></label>`).join('')}</span>`;
  }
  if(kind==='textarea'){
    return `<textarea class="input" rows="2" ${attr} ${dis} placeholder="${esc(ph)}">${esc(v)}</textarea>`;
  }
  // number / text
  const numeric = kind==='number';
  const stepAttr = numeric ? `step="${meta.step||(meta.type==='int'?1:0.05)}"` : '';
  const minAttr = meta.min!==undefined ? `min="${meta.min}"` : '';
  const maxAttr = meta.max!==undefined ? `max="${meta.max}"` : '';
  const typeAttr = numeric ? 'type="number"' : 'type="text"';
  return `<input class="input ${numeric?'mono':''}" ${typeAttr} ${stepAttr} ${minAttr} ${maxAttr} value="${esc(v)}" ${attr} ${dis} placeholder="${esc(ph)}">`;
}

/* 一格参数：标签 + 控件 + 类型角标 */
function ctlRow(field, value, attr, opt){
  opt = opt || {};
  const kind = controlOf(field);
  const meta = fieldMeta(field);
  const wide = (kind==='textarea' || (kind==='text' && String(value??'').length>16)) ? 'wide' : '';
  return `<div class="pfld ${wide} ${opt.cls||''}">
    <div class="plb">
      <span class="pn">${esc(fieldLabel(field))}</span>
      <i class="pk">${esc(field)}</i>
      <span class="ptype t-${kind}">${esc(CONTROL_LABEL[kind]||kind)}</span>
      ${meta.hint?`<span class="phint">${esc(meta.hint)}</span>`:''}
    </div>
    <div class="pctl">${ctlHtml(field, value, attr, opt)}</div>
  </div>`;
}

/* 把一个节点的几格参数整块渲染出来 */
function nodeBlock(node, fieldList, getVal, attrOf, opt){
  opt = opt || {};
  const live = fieldList.filter(f=>nodeSetFields(node.id, opt.wfName).includes(f));
  return `<div class="node-edit ${opt.readonly?'ro':''}">
    <div class="ne-hd">
      <span class="cid">${node.id}</span>
      <b>${esc(node.cls)}</b>
      <span class="tiny muted">${live.length} 个参数</span>
      <span style="flex:1"></span>
      ${opt.readonly?'<span class="rochip">只读 · 没改过</span>':''}
      ${opt.hdExtra||''}
    </div>
    <div class="ne-bd">
      ${live.map(f=>ctlRow(f, getVal(f), attrOf(f), {disabled:opt.readonly, wfName:opt.wfName})).join('')}
    </div>
  </div>`;
}

/* 这个能力的归档目录：<成果目录>/<能力名> */
function archiveDirOf(cap){
  const root = (S.service.archiveDir||'output/ComfyBridgeOutput').replace(/\/+$/,'');
  return root + '/' + (cap?cap.name:'未分类');
}

/* 这个工作流里所有文字类格子（给"描述框绑到哪"用） */
// 提示词节点不进 ② 的可勾清单，但描述框必须能绑到它——所以单独扫一遍
function allPromptFields(wfName){
  const out = [];
  const lib = WF_LIB[wfName];
  if(!lib) return out;
  lib.list.forEach(n=>{
    if(nodeRole(n)==='output' || nodeRole(n)==='upload') return;
    (n.w||[]).forEach(f=>{ if(isPromptLike(f)) out.push({ node:n.id, field:f, cls:n.cls }); });
  });
  return out;
}

/* 读出这个工作流的原始参数（= 默认档的值，只读） */
function readOriginal(wfName){
  const lib = WF_LIB[wfName];
  const o = {};
  if(!lib) return o;
  lib.list.forEach(n=>{
    (n.w||[]).forEach(f=>{
      if(f==='upload'||f==='image'||f==='audio') return;
      if(o[f]!==undefined) return;
      const t = fieldType(f);
      if(t==='int')        o[f] = (f==='width'||f==='height') ? 1024 : f==='steps' ? 28 : f==='seed' ? 0 : 1;
      else if(t==='float') o[f] = 1.0;
      else if(t==='bool')  o[f] = false;
      else if(t==='multi') o[f] = fieldOpts(f).length ? [fieldOpts(f)[0]] : [];
      else if(t==='combo') o[f] = fieldOpts(f)[0]||'';
      else o[f] = '';
    });
  });
  return o;
}

/* ---- 管理台交互 ---- */
function bindAdmin(){
  $$('[data-page]').forEach(el=>el.onclick=()=>{
    if(el.dataset.page==='studio'){ UI.route='studio'; render(); return; }
    UI.adminPage = el.dataset.page; render();
  });
  $$('[data-toggle]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const c = S.capabilities.find(x=>x.id===el.dataset.toggle);
    if(!c) return;
    if(!c.enabled && !capUsable(c)){ toast('这个能力还没配工作流，开不了'); return; }
    c.enabled = !c.enabled; saveState(); render();
    toast(c.enabled?'已启用':'已停用');
  });
  $$('[data-del]').forEach(el=>el.onclick=()=>{
    const c = S.capabilities.find(x=>x.id===el.dataset.del);
    openModal(`<div class="m-head"><h3>删除「${esc(c.name)}」？</h3><button class="btn ghost sm" data-close>✕</button></div>
      <div class="m-body"><div class="tiny" style="line-height:1.9">这会把能力连同它的档位表一起删掉。<br>
      <b>不会删除工作流 json 文件本身，也不会删已经生成的成品</b>。<br><br>如果你只是想暂时不让人看到，用"停用"更合适。</div></div>
      <div class="m-foot"><button class="btn sm" data-close>取消</button>
        <button class="btn sm danger" data-confirm-del="${c.id}">确认删除</button></div>`);
  });
  $$('[data-copy]').forEach(el=>el.onclick=()=>{
    const c = S.capabilities.find(x=>x.id===el.dataset.copy);
    const clone = JSON.parse(JSON.stringify(c));
    clone.id = c.id+'.copy'+Math.floor(Math.random()*90+10);
    clone.name = c.name+'（副本）';
    S.capabilities.push(clone); saveState(); render(); toast('已复制，档位一起带过去了');
  });
  $$('[data-edit]').forEach(el=>el.onclick=()=>{
    UI.capId = el.dataset.edit; UI.adminPage='grades'; UI.editingWfIndex=0; render();
  });
  $$('[data-reload]').forEach(el=>el.onclick=()=>{
    saveState(); render();
    toast('配置已重读，档位改动都在');
  });
  $$('[data-wfswitch]').forEach(el=>el.onclick=()=>{ UI.editingWfIndex=+el.dataset.wfswitch; render(); });

  // ② 勾节点：勾中的参数节点才会出现在 ④ / ⑤ 里
  $$('[data-picknode]').forEach(el=>el.onchange=()=>{
    const wf = currentCap().workflows[UI.editingWfIndex];
    if(!wf) return;
    const id = String(el.dataset.picknode);
    const checked = el.checked;
    const fs = nodeSetFields(id, wf.name);
    wf.fields = (wf.fields||[]).filter(f=>String(f.node)!==id);
    if(checked){
      fs.forEach(f=>wf.fields.push({ node:id, field:f }));
    }else{
      // 移出节点：把各档拷贝里这几格一起清掉，别留下看不见的脏值
      (wf.grades||[]).forEach(g=>{ if(g.params) fs.forEach(f=>delete g.params[f]); });
    }
    saveState();
    setTimeout(()=>{ render(); toast(checked?`已选 ${id} 号节点，${fs.length} 个参数进入设置区`:`已把 ${id} 号节点移出设置区`); }, 0);
  });
  $$('[data-unpicknode]').forEach(el=>el.onclick=()=>{
    const wf = currentCap().workflows[UI.editingWfIndex];
    const id = String(el.dataset.unpicknode);
    const fs = nodeSetFields(id, wf.name);
    wf.fields = (wf.fields||[]).filter(f=>String(f.node)!==id);
    (wf.grades||[]).forEach(g=>{ if(g.params) fs.forEach(f=>delete g.params[f]); });
    saveState(); render(); toast('已移出设置区');
  });

  // ④ 新增档位区：每个参数按它自己的类型取值（数字/开关/下拉/多选）
  $$('[data-drf]').forEach(el=>{
    const [node,field] = el.dataset.drf.split('|');
    const draft = UI.draft || (UI.draft = { name:'', values:{} });
    const read = ()=>{
      if(el.dataset.switch){
        const on = el.classList.contains('on');
        draft.values[field] = on ? 'true' : 'false';
      }else if(el.classList.contains('multi')){
        draft.values[field] = $$('input:checked', el).map(x=>x.value);
      }else{
        const v = (el.value||'').trim();
        draft.values[field] = v==='' ? '' : (isNumField(field) ? coerceField(field, v) : v);
      }
      saveState();
    };
    const ev = (el.dataset.switch || el.classList.contains('multi')) ? 'click' : 'change';
    if(el.dataset.switch){
      el.onclick = ()=>{ const on=!el.classList.contains('on'); el.classList.toggle('on', on); el.setAttribute('aria-checked', String(on)); const em=el.querySelector('em'); if(em) em.textContent=on?'开':'关'; draft.values[field] = on?'true':'false'; saveState(); };
    }else if(el.classList.contains('multi')){
      el.onchange = read;
    }else{
      el.onchange = read;
    }
  });
  const dn = $('[data-draftname]');
  if(dn) dn.oninput = ()=>{ (UI.draft || (UI.draft={name:'',values:{}})).name = dn.value; };

  // ⑤ 档位列表：改名 / 展开 / 删 / 改这一档拷贝里的值
  $$('[data-stop]').forEach(el=>el.onclick=e=>e.stopPropagation());
  $$('[data-gfield]').forEach(el=>el.onchange=()=>{
    const [k,i] = el.dataset.gfield.split('|');
    const wf = currentCap().workflows[UI.editingWfIndex];
    if(!wf || !wf.grades[+i]) return;
    if(wf.grades[+i].locked) return;
    wf.grades[+i][k] = el.value;
    saveState();
    if(k==='name') setTimeout(()=>{ const a=document.activeElement; render(); if(a && a.blur) a.blur(); }, 0);
  });
  $$('[data-gtoggle]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const i = +el.dataset.gtoggle;
    UI.gOpen = (UI.gOpen|0)===i ? -1 : i;
    render();
  });
  $$('[data-gval]').forEach(el=>{
    const [field,i] = el.dataset.gval.split('@');
    const wf = currentCap().workflows[UI.editingWfIndex];
    if(!wf || !wf.grades[+i] || wf.grades[+i].locked) return;
    const g = wf.grades[+i]; g.params = g.params || {};
    if(el.dataset.switch){
      el.onclick = ()=>{
        const on = !el.classList.contains('on');
        el.classList.toggle('on', on); el.setAttribute('aria-checked', String(on));
        const em = el.querySelector('em'); if(em) em.textContent = on?'开':'关';
        g.params[field] = on ? 'true' : 'false'; saveState();
      };
      return;
    }
    if(el.classList.contains('multi')){
      el.onchange = ()=>{ g.params[field] = $$('input:checked', el).map(x=>x.value); saveState(); };
      return;
    }
    el.onchange = ()=>{
      const v = (el.value||'').trim();
      g.params[field] = v==='' ? '' : (isNumField(field) ? coerceField(field, v) : v);
      saveState();
    };
  });
  $$('[data-gdel]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const wf = currentCap().workflows[UI.editingWfIndex];
    const i = +el.dataset.gdel;
    if(!wf.grades[i] || wf.grades[i].locked) return;
    const nm = wf.grades[i].name;
    wf.grades.splice(i,1);
    UI.gOpen = Math.min(i, wf.grades.length-1);
    saveState(); render();
    toast(`已删掉档位「${nm}」`);
  });
  // ④ 的【添加】：把原始工作流深拷贝一份，草稿里的值写进拷贝，成为新的一档
  const ga = $('[data-gadd]');
  if(ga) ga.onclick=()=>{
    const wf = currentCap().workflows[UI.editingWfIndex];
    if(!wf) return;
    if(!pickedNodeIds(wf).length){ toast('先勾一个参数节点'); return; }
    const draft = UI.draft || { name:'', values:{} };
    const nm = String(draft.name||'').trim();
    if(!nm){ toast('先给这一档起个名字'); const box=$('#newGradeName'); if(box) box.focus(); return; }
    if((wf.grades||[]).some(g=>g.name===nm)){ toast('这个名字已经有一档了，换一个'); return; }
    const copy = cloneWfParams(wf);              // 原始工作流的完整拷贝
    copy.values = Object.assign(copy.values, JSON.parse(JSON.stringify(draft.values||{})));
    wf.grades = wf.grades || [];
    wf.grades.push({
      name: nm, note:'',
      params: JSON.parse(JSON.stringify(draft.values||{})),
      copyFile: `${(S.service.copyDir||'./workflows/ComfyBridge').replace(/\/+$/,'')}/${wf.name.replace(/\.json$/,'')}__${nm}.json`
    });
    UI.gOpen = wf.grades.length-1;
    UI.draft = { name:'', values:{} };
    saveState(); render();
    const changed = Object.keys(draft.values||{}).length;
    toast(`已添加档位「${nm}」，创作台里多了一个按钮`);
  };
  // 描述框绑定（页面上不再提供下拉，读工作流时自动认；这里保留兜底）
  const pn = $('[data-pnode]');
  if(pn) pn.onchange=()=>{
    const wf=currentCap().workflows[UI.editingWfIndex];
    const [node,field] = pn.value.split('|');
    wf.prompt = Object.assign({ label:'描述', required:true }, wf.prompt, { node, field });
    saveState();
  };

  const sv = $('[data-savewf]');
  if(sv) sv.onclick = ()=>{ saveState(); toast('已保存'); render(); };
  const ts = $('[data-savecfg]');
  if(ts) ts.onclick = ()=>{ saveState(); toast('已保存'); render(); };
  const tc = $('#testConn');
  if(tc) tc.onclick = ()=>{ tc.textContent='连接中…'; setTimeout(()=>{ tc.textContent='测试连接'; toast(UI.comfyOnline?'连接成功：队列空闲':'连接失败：目标计算机积极拒绝'); }, 700); };
  $$('[data-s]').forEach(el=>el.onchange=()=>{
    let v = el.value;
    if(el.dataset.s==='archiveDir'){
      v = String(v||'').trim() || 'output/ComfyBridgeOutput';
      if(v.includes('..')){ toast('路径里不能有 ..'); render(); return; }
      if(v.includes('models')){ toast('不能放在 models 目录里'); render(); return; }
    }
    S.service[el.dataset.s] = v; saveState();
    if(el.dataset.s==='archiveDir'){ toast('成果目录已改成：'+v); render(); }
  });
  $$('[data-sw]').forEach(el=>el.onclick=()=>{
    const k = el.dataset.sw; S.service[k] = !S.service[k];
    el.classList.toggle('on', S.service[k]); saveState();
    if(k==='bindLan' && S.service[k]) toast('已开启，记得设口令');
  });
  const rr2 = $('#rerun');
  if(rr2) rr2.onclick=()=>{ toast('正在自检…'); setTimeout(()=>render(), 500); };
  $$('[data-discard]').forEach(el=>el.onclick=()=>{
    openModal(`<div class="m-head"><h3>放弃这些修改？</h3><button class="btn ghost sm" data-close>✕</button></div>
      <div class="m-body tiny">改过但没保存的，都会恢复成上次保存的样子。</div>
      <div class="m-foot"><button class="btn sm" data-close>取消</button><button class="btn sm danger" data-do-reset>放弃</button></div>`);
  });
}

/* ---- 清空这个工作流已勾的档位字段（换工作流时用） ---- */
function clearWfFields(){
  const wf = currentCap().workflows[UI.editingWfIndex];
  if(!wf) return;
  openModal(`<div class="m-head"><h3>重新挑一遍参数？</h3><button class="btn ghost sm" data-close>✕</button></div>
    <div class="m-body tiny" style="line-height:1.9">
      会清掉「${esc(wf.name)}」已勾的节点和 ${Math.max((wf.grades||[]).length-1,0)} 个档位。<br>
      <b>工作流文件不动。</b>
    </div>
    <div class="m-foot"><button class="btn sm" data-close>取消</button>
      <button class="btn sm danger" data-do-clearwf>清空</button></div>`);
  $$('[data-do-clearwf]').forEach(b2=>b2.onclick=()=>{
    wf.fields = []; wf.grades = [ { name:'默认', locked:true, note:'原样出图，参数没改过' } ];
    saveState(); closeModal(); render(); toast('已清空，回左边重新勾节点');
  });
}

/* ================= 历史画廊 ================= */

function viewGallery(){
  const done = S.jobs.filter(j=>doneRuns(j).length);
  const caps = ['全部', ...new Set(done.map(j=>j.capName))];
  const shown = UI.galleryFilter==='全部'? done : done.filter(j=>j.capName===UI.galleryFilter);
  const tiles = [];
  shown.forEach(j=>doneRuns(j).forEach((r,i)=>tiles.push({j,r,i})));
  return `<div class="admin">
    ${viewTopbar()}
    <div class="admin-main" style="padding-top:22px"><div class="inner" style="max-width:1100px">
      <div class="spread" style="margin-bottom:16px">
        <div><h2>历史记录</h2><div class="sub">生成过的成品都在这儿</div></div>
        <div class="row">
          <select class="input" style="width:140px" id="gfilter">${caps.map(c=>`<option ${c===UI.galleryFilter?'selected':''}>${esc(c)}</option>`).join('')}</select>
          <button class="btn" id="batchDl">⬇ 批量下载（${tiles.length}）</button>
        </div>
      </div>
      ${tiles.length? `<div class="gallery">
        ${tiles.map(t=>`<div class="card" style="overflow:hidden;cursor:pointer">
          <div class="art" style="border:0;border-radius:0;aspect-ratio:1/1">${t.r.media==='video'?mockVideo(t.r.seed):mockArt(t.r.seed,t.j.capName)}</div>
          <div style="padding:9px 11px">
            <div class="tiny" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.j.prompt)}</div>
            <div class="tiny muted" style="margin-top:2px">${esc(t.j.capName)} · ${esc(t.r.grade||'默认')} · 种子 ${t.r.seed}</div>
          </div></div>`).join('')}
      </div>` : `<div class="empty"><div style="font-size:30px">🗂</div><div class="tiny">这里还没有记录，先去创作台生成几张</div></div>`}
    </div></div>
  </div>`;
}
function bindGallery(){
  const f = $('#gfilter');
  if(f) f.onchange=()=>{ UI.galleryFilter=f.value; render(); };
  const b = $('#batchDl');
  if(b) b.onclick=()=>toast('演示版不做真打包');
}

/* ================= 弹层工具 ================= */
function openModal(html, noMaskClose){
  closeModal();
  const mask = document.createElement('div');
  mask.className='modal-mask'; mask.id='mask';
  mask.innerHTML = `<div class="modal ${html.length>900?'wide':''}">${html}</div>`;
  document.body.appendChild(mask);
  $$('[data-close]', mask).forEach(el=>el.onclick=closeModal);
  mask.onclick = e=>{ if(e.target===mask && !noMaskClose) closeModal(); };
  $$('[data-confirm-del]', mask).forEach(el=>el.onclick=()=>{
    S.capabilities = S.capabilities.filter(c=>c.id!==el.dataset.confirmDel);
    saveState(); closeModal(); render(); toast('已删除');
  });
  $$('[data-do-reset]', mask).forEach(el=>el.onclick=()=>resetState());
  return mask;
}
function closeModal(){ const m=$('#mask'); if(m) m.remove(); }
function closeAll(){ closeModal(); }

/* ================= 向导 ================= */
function renderWizard(){
  const steps = [
    { t:'欢迎使用 ComfyBridge', d:'它把你写的描述变成 ComfyUI 执行的任务。先确认两件事，30 秒。',
      b:`<div class="field"><label>ComfyUI 地址</label><input class="input mono" value="http://127.0.0.1:8188">
        <div class="hint">先打开 ComfyUI。连不上时会提示你。</div></div>
        <div class="field"><label>成果物放哪</label><input class="input mono" value="output/ComfyBridgeOutput">
        <div class="hint">成品会按能力分开放在这里，ComfyUI 的 output 不会再乱。</div></div>` },
    { t:'给能力排几档', d:'一个能力配几档，用户就只能看到这几个按钮。',
      b:`<div class="step"><div class="num">1</div><div class="txt"><b>打开管理台 → 档位表</b><p>左边勾几个节点，右边就会出现这些参数。</p></div></div>
         <div class="step"><div class="num">2</div><div class="txt"><b>填一组值，起个名字，点「添加」</b><p>比如「快速」768×768 8 步，「精细」1344×768 30 步。</p></div></div>
         <div class="step"><div class="num">3</div><div class="txt"><b>保存</b><p>创作台立刻多出这两个按钮，不用重启。</p></div></div>` },
    { t:'用户侧只剩两样东西', d:'一个描述框，一排档位按钮。没有别的。',
      b:`<div class="field"><label>创作台输入区</label>
        <div style="border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff">
          <div class="row" style="margin-bottom:10px"><div class="grades">
            <button class="grade">快速</button><button class="grade on">均衡</button><button class="grade">精细</button></div></div>
          <div class="tiny muted">描述你想要的画面，例如：雨夜霓虹街道……</div>
        </div>
        <div class="hint">用户只看到档位名，看不到具体参数。</div></div>` },
  ];
  const st = steps[UI.wizardStep];
  const html = `<div class="wizard-mask" id="wiz">
    <div class="wizard">
      <div class="w-head"><h3>${esc(st.t)}</h3><div class="tiny muted">${esc(st.d)}</div></div>
      <div class="w-body">${st.b}</div>
      <div class="w-foot">
        <div class="dots">${steps.map((_,i)=>`<i class="${i===UI.wizardStep?'on':''}"></i>`).join('')}</div>
        <div class="row">
          <button class="btn sm ghost" id="wizSkip">跳过</button>
          ${UI.wizardStep>0?'<button class="btn sm" id="wizPrev">上一步</button>':''}
          <button class="btn sm primary" id="wizNext">${UI.wizardStep<steps.length-1?'下一步':'开始配置'}</button>
        </div>
      </div>
    </div></div>`;
  const exist = $('#wiz'); if(exist) exist.remove();
  document.body.insertAdjacentHTML('beforeend', html);
  $('#wizSkip').onclick = ()=>{ UI.showWizard=false; $('#wiz').remove(); };
  const prev = $('#wizPrev'); if(prev) prev.onclick = ()=>{ UI.wizardStep--; renderWizard(); };
  $('#wizNext').onclick = ()=>{
    if(UI.wizardStep<steps.length-1){ UI.wizardStep++; renderWizard(); }
    else{ UI.showWizard=false; $('#wiz').remove(); UI.route='admin'; UI.adminPage='caps'; render(); toast('配好了，先去给用得上的能力排几个档位'); }
  };
}

/* ================= 启动 ================= */
function bindGlobal(){
  $$('[data-nav]').forEach(el=>el.onclick=()=>{
    const t = el.dataset.nav;
    if(t==='admin'){ UI.route='admin'; UI.adminPage='caps'; }
    else if(t==='gallery'){ UI.route='gallery'; UI.galleryFilter='全部'; }
    else UI.route='studio';
    render();
  });
}

window.addEventListener('DOMContentLoaded', ()=>{
  normalizeJobs();
  seedJobs();
  resumeJobs();
  if(!localStorage.getItem('comfybridge_seen_wizard_v3')){
    UI.showWizard = true; UI.wizardStep = 0;
    localStorage.setItem('comfybridge_seen_wizard_v3','1');
  }
  render();
});

</script>
