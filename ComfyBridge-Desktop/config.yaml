version: '1.05'
service:
  comfy: http://127.0.0.1:8188
  port: 8190
  bindLan: true
  comfyOutputDir: D:\ComfyUI-0.37.1\ComfyUI\output
  archiveDir: D:\ComfyUI-0.37.1\ComfyUI\output\ComfyBridgeOutput
  wfDir: ./workflows
  copyDir: ./workflows/ComfyBridge
  uploadDir: ./data/uploads
  taskDir: ./data/tasks
  uploadMaxMB: 32
  maxQueue: 20
  keepDays: 7
  maxRecords: 500
capabilities:
- id: image.generate
  name: 图片生成
  em: 🖼️
  group: 图像
  enabled: true
  desc: 文字描述生成图片，支持参考图
  maxRefs: 3
  requiredRef: false
  rules:
  - when: 图片 = 0
    wf: 文生图
  - when: 图片 ≥ 1
    wf: 参考生图
  fallback: auto
  workflows:
  - 文生图
  - 参考生图
- id: sheet.character
  name: 角色设定图
  em: 👤
  group: 设定图
  enabled: true
  desc: 多视角角色设定，四视图/四宫格/单张全身，支持参考角色与线稿
  maxRefs: 1
  requiredRef: false
  rules:
  - when: 图片 = 0
    wf: 设定图-文生图
  - when: 图片 ≥ 1
    wf: 设定图-参考生图
  fallback: auto
  workflows:
  - 设定图-文生图
  - 设定图-参考生图
  - 设定图-锁定同角色
  - 设定图-只借画风
- id: sheet.scene
  name: 场景设定图
  em: 🏞
  group: 设定图
  enabled: true
  desc: 场景概念设定，文生图/图生图/扩图，支持布局图识别与推拉转镜头
  maxRefs: 4
  requiredRef: false
  rules:
  - when: 模式 = 文生图
    wf: 场景设定图-文生图
  - when: 模式 = 图生图/扩图
    wf: 场景设定图-参考生图
  fallback: auto
  workflows:
  - 场景设定图-文生图
  - 场景设定图-参考生图
- id: sheet.prop
  name: 道具设定图
  em: 🗡
  group: 设定图
  enabled: true
  desc: 道具概念设定，多视图/单视图，支持参考图与线稿
  maxRefs: 1
  requiredRef: false
  rules:
  - when: 图片 = 0
    wf: 道具设定图-文生图
  - when: 图片 ≥ 1
    wf: 道具设定图-参考生图
  fallback: auto
  workflows:
  - 道具设定图-文生图
  - 道具设定图-参考生图
- id: board.story
  name: 宫格分镜故事板
  em: ▦
  group: 故事板
  enabled: true
  desc: 逐格描述镜头画面，一次生成四/六/九宫格分镜故事板
  maxRefs: 6
  requiredRef: false
  rules:
  - when: 图片 = 0/1~6
    wf: 故事板-参考生图
  fallback: auto
  workflows:
  - 故事板-参考生图
  - 故事板-参考生图-宽幅6格
  - 故事板-参考生图-线稿
  - 故事板-参考生图-宽幅6格-线稿
- id: video.generate
  name: 视频生成
  em: 🎬
  group: 视频
  enabled: true
  media: video
  desc: 文生视频 / 首尾帧 / 参考生视频 / 故事板生视频，四种模式共用一页
  maxRefs: 6
  requiredRef: false
  workflows:
  - 视频生成-文生视频-h3
  - 视频生成-首尾帧生视频-h3
  - 视频生成-参考生视频-h3
  - 视频生成-故事板生视频-h3
- id: video.ext
  name: 视频生成扩展
  em: 🎬
  group: 视频
  enabled: true
  media: video
  desc: 多参极速生视频：图 / 视频 / 音频参考 + 宽高比，每档一份独立工作流
  maxRefs: 6
  workflows:
  - 视频扩展-多参极速生视频-4采480P
  - 视频扩展-多参极速生视频-8采480P
  - 视频扩展-多参极速生视频-8采768P
  - 视频扩展-多参极速生视频-20采480P
  - 视频扩展-多参极速生视频-20采768P
- id: canvas.video
  name: 视频生成画布
  em: 🎬
  group: 视频
  enabled: true
  kind: canvas
  desc: 无限画布：图片/视频/音频节点连成一条线，引用素材直接生成
  maxRefs: 6
  workflows:
  - 画布-图片生成
  - 画布-视频生成
  - 画布-图片生成-参考
- id: audio.generate
  name: 音频生成
  em: 🎵
  group: 音频
  enabled: true
  media: audio
  desc: 音乐生成 / 参考生成音乐 / 语音生成 / 声音克隆，四个子功能共用一个页面
  maxRefs: 1
  workflows:
  - 音频-音乐生成
  - 音频-参考生成音乐
  - 音频-语音生成
  - 音频-声音克隆
