<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F3EE">
<title>ComfyBridge</title>
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/logo-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/logo-touch-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="application-name" content="ComfyBridge">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ComfyBridge">
<style>
/* ============ ComfyBridge 页面样式 ============ */
:root{
  --bg:#f2f4f8; --card:#fff; --ink:#141a22; --ink2:#45505f; --ink3:#8792a2; --ink4:#b6bcc8;
  --line:#e2e7ef; --line2:#eef1f7;
  --accent:#2f6bff; --accent2:#eaf0ff; --accent3:#c9d9ff;
  --green:#2fa36b; --green2:#e8f8f0; --green3:#b7e3cc;
  --amber:#e8a33a; --amber2:#fff8ec; --amber3:#f0dcb8;
  --red:#e0523a; --red2:#fdefec; --red3:#f0c9bd;
  --purple:#7c6bd6; --purple2:#f2effe;
  --r:10px; --sh:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06);
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-y:auto;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d6dce7;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#c3cad8}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 通用 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{background:#f7f9fc;border-color:#d3dae6}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:#2359e0}
.btn.danger{color:var(--red);border-color:var(--red3);background:#fff}
.btn.danger:hover{background:var(--red2)}
.btn.warn{color:#8a5a00;border-color:var(--amber3);background:var(--amber2)}
.btn.warn:hover{background:#fdeccd}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#f2f5fa}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary:disabled{background:#9db6f5;border-color:#9db6f5}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:20px;
  font-size:11.5px;background:#f2f5fa;color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--accent2);border-color:var(--accent3);color:#1d4ed8;font-weight:600}
.chip.green{background:var(--green2);border-color:var(--green3);color:#0f6b45}
.chip.amber{background:var(--amber2);border-color:var(--amber3);color:#8a5a00}
.chip.red{background:var(--red2);border-color:var(--red3);color:#c0392b}
.chip.gray{background:#f5f7fa;border-color:var(--line);color:var(--ink3)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.g{background:var(--green);box-shadow:0 0 0 3px rgba(47,163,107,.15)}
.dot.r{background:var(--red);box-shadow:0 0 0 3px rgba(224,82,58,.15)}
.dot.a{background:var(--amber)}
.dot.x{background:#c6ccd6}
.muted{color:var(--ink3)}
.tiny{font-size:11.5px}
.mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace;font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.field .hint{font-size:11.5px;color:var(--ink3);line-height:1.5}
.input,select.input,textarea.input{
  width:100%;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
  font-size:13px;outline:none;transition:.15s;color:var(--ink);
}
textarea.input{height:auto;padding:9px 12px;line-height:1.6;resize:vertical;min-height:66px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.12)}
.input::placeholder{color:var(--ink4)}
.input.mono{font-family:Consolas,Menlo,monospace;font-size:12px}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238792a2'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:30px}
.switch{width:38px;height:22px;border-radius:22px;background:#dfe4ec;position:relative;transition:.18s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.switch.on{background:var(--green)}
.switch.on::after{left:19px}
.switch.blue.on{background:var(--accent)}
.hr{height:1px;background:var(--line2);margin:16px 0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:60px 24px;color:var(--ink3)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{padding:9px 16px;font-size:13px;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.codebox{background:#0f1420;color:#9fb0cc;border-radius:8px;padding:12px 14px;font-family:Consolas,Menlo,monospace;font-size:11.5px;line-height:1.7;overflow:auto}

/* ---------- 顶栏 ---------- */
.topbar{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.brand img{width:22px;height:22px;border-radius:7px;display:block;flex:0 0 auto}
.health{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:20px;background:#f5f8fd;border:1px solid var(--line);font-size:12px;cursor:pointer;transition:.15s}
.health:hover{background:#eef4ff}
.health.off{background:var(--red2);border-color:var(--red3)}
.health.off .txt{color:#c0392b}
.topbar .spacer{flex:1}
.kbd{font-size:11px;color:var(--ink3);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:#fbfcfe}

/* ---------- 布局 ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50}
/* 「未连接」的短文案只在手机上用，桌面上照旧显示整句 */
.topbar .health .txt-short{display:none}
/* 顶栏「提示词模板」开关：和提示词速取窗共用一个状态 */
.pt-top-switch{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 9px 0 7px;border:1px solid var(--line);
  border-radius:9px;background:#fff;color:var(--ink2);font-size:12px;white-space:nowrap;cursor:pointer;flex:0 0 auto}
.pt-top-switch:hover{border-color:var(--accent)}
.pt-top-switch .pts-track{position:relative;width:30px;height:17px;border-radius:10px;background:#cfd6e2;transition:background .16s;flex:0 0 30px}
.pt-top-switch .pts-knob{position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(20,30,50,.25);display:flex;align-items:center;justify-content:center;transition:transform .16s}
.pt-top-switch .pts-knob svg{display:none;width:9px;height:9px;color:#5f6b7a}
.pt-top-switch .pts-label{line-height:1}
.pt-top-switch.on .pts-track{background:var(--accent)}
.pt-top-switch.on .pts-knob{transform:translateX(13px)}
.pt-top-switch.on .pts-label{color:var(--accent);font-weight:600}
.studio{flex:1;display:grid;--railw:224px;--draww:232px;grid-template-columns:var(--railw) minmax(0,1fr) var(--draww);align-items:start;transition:grid-template-columns .16s}
.rail{background:#fafbfe;border-right:1px solid var(--line);padding:12px 10px 24px;position:sticky;top:52px;align-self:start;max-height:calc(100vh - 52px);overflow-y:auto}
.rail .group{font-size:11px;font-weight:700;color:var(--ink3);padding:10px 8px 6px;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.rail .item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:13px;color:var(--ink2);cursor:pointer;transition:.12s;margin-bottom:1px;white-space:nowrap}
.rail .item > span:not(.em):not(.tag){overflow:hidden;text-overflow:ellipsis;min-width:0}
.rail .item:hover{background:#eef2f9}
.rail .item.on{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(47,107,255,.28)}
.rail .item.dis{color:var(--ink4);cursor:pointer}
.rail .item.dis:hover{background:#f2f5fa}
.rail .item .em{font-size:14px;width:18px;text-align:center;flex:0 0 auto}
.rail .item .tag{margin-left:auto;flex:0 0 auto;white-space:nowrap;font-size:9.5px;padding:1px 4px;border-radius:4px;background:#eef1f7;color:var(--ink3)}
.rail .item.on .tag{background:rgba(255,255,255,.22);color:#fff}
.rail .tip{margin:10px 6px 0;padding:9px 10px;border-radius:8px;background:var(--amber2);border:1px dashed var(--amber3);font-size:11px;color:#8a5a00;line-height:1.55;cursor:pointer}

/* 生成区自己滚：滚动条留在中间内容区，不再挂在整页最外面（需求 #9）。
   左右栏 sticky、输入区固定在底部，只有 .chat-scroll 滚。 */
.chat{min-width:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;
  height:calc(100vh - 52px);min-height:0;overflow:hidden}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 22px 20px;
  scrollbar-width:thin;scrollbar-color:#c9d2e0 transparent;-webkit-overflow-scrolling:touch}
.chat-scroll::-webkit-scrollbar{width:7px}
.chat-scroll::-webkit-scrollbar-thumb{background:#c9d2e0;border-radius:6px}
.chat-scroll::-webkit-scrollbar-track{background:transparent}
.chat-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* 输入区 */
.composer{position:relative;bottom:auto;flex:0 0 auto;border-top:1px solid var(--line);padding:12px 22px 14px;background:#fff;z-index:20}
.composer-inner{max-width:720px;margin:0 auto}
.parambar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.parambar .pb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.12s;position:relative}
.parambar .pb:hover{border-color:#c9d3e3;background:#fbfcfe}
.parambar .pb.on{border-color:var(--accent);color:var(--accent);background:var(--accent2)}
.parambar .pb .val{font-weight:600}
.parambar .pb .caret{font-size:9px;color:var(--ink4)}
.inputbox{border:1.6px solid var(--accent);border-radius:12px;padding:8px 10px 8px;background:#fff;box-shadow:0 4px 18px rgba(47,107,255,.08);transition:.15s}
.inputbox.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,82,58,.1)}
.inputbox textarea{width:100%;border:0;outline:none;resize:none;font-size:13.5px;line-height:1.65;min-height:52px;max-height:150px;padding:4px 3px;background:transparent}
.inputbox textarea::placeholder{color:var(--ink4)}
.inputbox .foot{display:flex;align-items:center;gap:8px;padding-top:6px;border-top:1px dashed var(--line2);margin-top:4px}
.refs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ref-thumb{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#eef2f8}
.ref-thumb img{width:100%;height:100%;object-fit:contain;display:block}
.ref-thumb .x{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(15,20,32,.65);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.sendbtn{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.sendbtn:disabled{background:#c3d2f5;cursor:not-allowed}
.scope-hint{font-size:11.5px;color:var(--ink4);margin-left:2px}
/* 画质档：一整组参数绑在一起的按钮，点一下同时改分辨率/步数/CFG */
.grades{display:inline-flex;align-items:center;padding:2px;border-radius:9px;background:#eef1f7;border:1px solid #e6eaf2;gap:2px}
.grade{height:26px;padding:0 11px;border:0;border-radius:7px;background:transparent;font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.12s;font-family:inherit;white-space:nowrap}
.grade:hover{color:var(--ink)}
.grade.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 4px rgba(20,30,50,.10)}
.grade-note{font-size:11.5px;color:var(--ink4)}
/* 管理台档位表 */
.grade-row td{vertical-align:middle}
.grade-row .gname{font-weight:600;color:var(--ink)}
.grade-row .badge-def{display:inline-block;margin-left:6px;font-size:10.5px;padding:1px 6px;border-radius:20px;background:var(--green2);color:var(--green);font-weight:600;vertical-align:2px}
.grade-row .badge-def.none{background:#f0f2f6;color:var(--ink4)}
.grade-detail{font-size:11.5px;color:var(--ink3);margin-top:2px}

/* 气泡 */
.msg-u{align-self:flex-end;max-width:78%;background:var(--accent);color:#fff;padding:10px 14px;border-radius:12px 12px 3px 12px;font-size:13.5px;line-height:1.6;box-shadow:0 2px 10px rgba(47,107,255,.18)}
.msg-u .meta{font-size:10.5px;color:#c5d7ff;margin-top:5px}

/* 任务卡片 */
.job{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;box-shadow:var(--sh);animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.job .head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line2);font-size:12.5px}
.job .head .wf{color:var(--ink3);font-size:11.5px}
.job .body{padding:12px 14px}
.progress{height:6px;border-radius:6px;background:#eef1f7;overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#2f6bff,#5b8cff);border-radius:6px;transition:width .35s}
.grid{display:grid;gap:8px}
.grid.g2{grid-template-columns:1fr 1fr}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.tile{position:relative;border-radius:9px;overflow:hidden;background:#eef2f8;border:1px solid var(--line2);aspect-ratio:1/1}
.tile img{width:100%;height:100%;object-fit:contain;display:block}
.tile.portrait{aspect-ratio:3/4}
.tile.wide{aspect-ratio:16/9}
.tile.vid{aspect-ratio:16/9}
/* 需求7：视频右上角工具条，避开底部原生控件，不拦截播放点击 */
.tile .vtop{position:absolute;top:6px;right:6px;z-index:3;display:flex;gap:5px}
.tile .vtop button{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.94);color:#222;font-size:12px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25);opacity:.9}
.tile .vtop button:hover{opacity:1;background:#fff}
.tile .acts{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,28,0) 40%,rgba(10,16,28,.72));opacity:0;transition:.15s;display:flex;align-items:flex-end;gap:6px;padding:8px}
.tile:hover .acts{opacity:1}
.tile .acts button{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.94);color:#222;font-size:12px;display:flex;align-items:center;justify-content:center}
.tile .acts button:hover{background:#fff;transform:translateY(-1px)}
.tile .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink4);font-size:11px;background:
  repeating-linear-gradient(45deg,#eef2f8,#eef2f8 8px,#e8edf5 8px,#e8edf5 16px)}
.tile .badge{position:absolute;top:6px;left:6px;padding:1px 7px;border-radius:20px;background:rgba(10,16,28,.55);color:#fff;font-size:10px}
.job .foot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--ink3);background:#fcfdff}
.job .foot .grow{flex:1}
.job.fail{border-color:var(--red3)}
.job.fail .head{background:var(--red2);border-bottom-color:var(--red3);color:#a83a20}
.job.done .head{background:#fbfdfc}
.job .errbox{margin:0 14px 12px;padding:10px 12px;border-radius:8px;background:var(--red2);border:1px solid var(--red3);font-size:12px;color:#8a3a25;line-height:1.6}
.job .errbox .raw{margin-top:6px;font-family:Consolas,Menlo,monospace;font-size:10.5px;color:#a5715f;max-height:0;overflow:hidden;transition:.2s}
.job .errbox.open .raw{max-height:160px;overflow:auto}
.eta{font-size:11.5px;color:var(--ink3)}
.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* 右侧抽屉：固定头（状态+全选/删除）+ 独立滚动的任务列表 */
.drawer{background:#fafbfe;padding:12px 12px 12px;position:sticky;top:52px;align-self:start;
  height:calc(100vh - 52px);max-height:calc(100vh - 52px);display:flex;flex-direction:column;overflow:hidden}
.drawer-fixed{flex:0 0 auto;position:relative;z-index:2;background:#fafbfe;padding-bottom:8px;
  border-bottom:1px solid var(--line2);box-shadow:0 6px 10px -8px rgba(10,18,35,.25)}
.drawer-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-top:8px;
  scrollbar-width:thin;scrollbar-color:#c9d2e0 transparent}
.drawer-scroll::-webkit-scrollbar{width:6px}
.drawer-scroll::-webkit-scrollbar-thumb{background:#c9d2e0;border-radius:6px}
.drawer h4{margin:0 0 8px;font-size:11px;color:var(--ink3);letter-spacing:.05em;font-weight:700}
/* 任务项：顶部一行信息 + 底部一行缩略图，高度一致 */
.task-item{flex-direction:column;align-items:stretch;gap:5px;padding:8px}
.ti-top{display:flex;align-items:center;gap:8px}
.task-thumbs{height:44px;display:flex;align-items:center;gap:5px;padding-left:23px}
.task-thumbs img{height:44px;width:60px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#eef2f8}
.tthumb-ph{display:inline-flex;align-items:center;justify-content:center;width:60px;height:44px;border-radius:6px;
  border:1px dashed var(--line2);background:#f4f6fa;color:var(--ink3);font-size:18px}
.task-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.task-item:hover{background:#eef2f9}
.task-item.on{background:#fff;border-color:var(--accent3);box-shadow:0 1px 4px rgba(20,30,50,.06)}
.task-item .t{flex:1;min-width:0}
.task-item .t b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-item .t span{font-size:10.5px;color:var(--ink3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 弹层 */
.pop{position:absolute;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(20,30,50,.16);padding:8px;min-width:150px}
.pop .it{padding:6px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pop .it:hover{background:var(--accent2);color:var(--accent)}
.pop .it.sel{color:var(--accent);font-weight:600}

.grow.dragging{opacity:.45}
.grow.dropover{border-color:var(--accent);background:var(--accent2)}

/* ---------- 管理台 ---------- */

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.panel h3{margin:0 0 14px;font-size:14px;display:flex;align-items:center;gap:8px}
.panel h3 .tag{font-size:10.5px;font-weight:500;color:var(--ink3);background:#f2f5fa;padding:1px 7px;border-radius:5px}

.cap-row:hover{border-color:#cfd8e6;box-shadow:0 2px 10px rgba(20,30,50,.05)}
.cap-row.nocfg{background:#fafbfd;border-style:dashed}
.cap-row.nocfg .em{opacity:.55;filter:grayscale(.5)}
.cap-row .ic{width:34px;height:34px;border-radius:9px;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.cap-row .main{flex:1;min-width:0}
.cap-row .main b{font-size:13.5px;display:flex;align-items:center;gap:8px}

.wftag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:var(--green2);border:1px solid var(--green3);font-size:11px;color:#0f6b45}
.wftag.warn{background:var(--amber2);border-color:var(--amber3);color:#8a5a00}
.wftag.err{background:var(--red2);border-color:var(--red3);color:#c0392b}
.map-table{width:100%;border-collapse:collapse;font-size:12.5px}
.map-table th{text-align:left;font-size:11px;color:var(--ink3);font-weight:600;padding:7px 9px;background:#f7f9fc;border-bottom:1px solid var(--line);white-space:nowrap}
.map-table td{padding:6px 9px;border-bottom:1px solid var(--line2);vertical-align:middle}
.map-table tr:hover td{background:#fbfcff}
.map-table .input{height:30px;font-size:12px;padding:0 8px;width:100%;min-width:0}
.map-table.maps{table-layout:fixed}
.map-table.maps td:nth-child(2) select{width:100%}
.map-table.maps .cell-fill{display:block;background:var(--accent2);color:#1d4ed8;padding:4px 7px;border-radius:5px;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-table.maps td:last-child{padding-left:0}
.map-table.maps td:nth-child(5){text-align:center}
.node-list{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:#fcfdff}
.node-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line2);font-size:12px;cursor:pointer}
.node-row:hover{background:#f2f6ff}
.node-row .id{width:22px;color:var(--ink3);font-family:Consolas,Menlo,monospace;font-size:11px}
.node-row .cls{flex:1;color:var(--ink2)}
.node-row .cls.out{color:#0f6b45;font-weight:600}
.check-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12.5px;cursor:pointer}

.check-row .nm{flex:1}
.check-row .ty{font-size:11px;color:var(--ink3)}

.diag-row.ok{background:var(--green2);border-color:var(--green3)}
.diag-row.warn{background:var(--amber2);border-color:var(--amber3)}
.diag-row.err{background:var(--red2);border-color:var(--red3)}

.diag-row.ok .ic{background:var(--green)}
.diag-row.warn .ic{background:var(--amber)}
.diag-row.err .ic{background:var(--red)}
.diag-row.skip .ic{background:var(--ink3)}
.cond-row{display:flex;align-items:center;gap:8px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}

.drag{color:var(--ink4);cursor:grab;font-size:14px;letter-spacing:-2px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}

.step .txt{flex:1}

.step .txt p{margin:3px 0 0;font-size:12px;color:var(--ink3);line-height:1.6}

.wizard .w-head h3{margin:0 0 6px;font-size:17px}

.dots{display:flex;gap:6px}

  .studio{--railw:172px;grid-template-columns:var(--railw) minmax(0,1fr)}

/* ===== 档位 / 归档 相关（本轮新增） ===== */
.gradechip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--accent2);color:var(--accent);font-weight:600}
.vechip{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;background:#f2f5fa;border:1px solid var(--line2);color:var(--ink3);font-weight:500;white-space:nowrap}
.archnote{display:flex;align-items:center;gap:7px;margin-top:10px;padding:7px 10px;border-radius:7px;background:#f4f7fd;border:1px dashed #ccd8ee;font-size:11.5px;color:#4a5b74;overflow:hidden}
.archnote .ico{flex:0 0 auto}
.archnote .p{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1d4ed8}
.path-tree{background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:12px;line-height:2;color:var(--ink2)}
.path-tree .d{color:#1d4ed8;font-weight:600}
.path-tree .muted{color:var(--ink4)}
.grades-table td{padding:5px 6px}
.grades-table .input{height:28px;font-size:12px;padding:0 6px}
.grades-table .row{gap:4px}
.btn.warn{background:var(--red2);border-color:var(--red3);color:#a83a2a}
.btn.warn:hover{background:#fbe0da}
.brokenbox{padding:11px 13px;border-radius:9px;background:var(--red2);border:1px solid var(--red3);font-size:12.5px;color:#8a3a25;line-height:1.6}
/* 路径输入较长时不要被右侧按钮挤压 */
.panel .input.mono{min-width:0}
/* 档位表：必须固定布局，否则列宽会随内容伸缩导致输入框被压窄 */
.grades-table{table-layout:fixed}
.grades-table td,.grades-table th{padding-left:5px;padding-right:5px}
.grades-table .tiny{white-space:nowrap}
/* 带扩展列时（例如视频的"帧数"），列宽按比例分但保证每列下限，超出就横向滚动 */
.grades-table input.input{min-width:46px}
.grades-table .wh-cell{display:flex;gap:3px;align-items:center;min-width:0}
.grades-table .wh-cell input{flex:1 1 0;width:100%}
.grades-table{table-layout:auto;width:100%}
.grades-table th{white-space:nowrap;font-size:10.5px}
/* 每列给出可用最小宽度；列多时整表横向滚动，而不是把某一列压死 */
.grades-table{min-width:560px}

/* 说明列给足宽度，放不下就整表横向滚动（比把说明压成半句话好） */
/* 档位表：右侧"默认/删除"固定在可视范围内，只让数值列滚动 */
/* 说明列：允许它自己再窄一点，一个字都不许被截断 */

/* ===== 档位表（定稿）：表格只放数值，说明另起一行 ===== */
.grades-table{table-layout:auto;width:100%}
.grades-table th{white-space:nowrap;font-size:10.5px;padding:7px 6px}
.grades-table td{padding:5px 6px;vertical-align:middle}
.grades-table .input{height:28px;font-size:12px;padding:0 6px;width:100%;min-width:44px}
.grades-table th:first-child{min-width:78px}
.grades-table th:nth-child(2){min-width:128px}
.grades-table th:nth-last-child(2),.grades-table th:last-child{min-width:44px}
.grades-table .wh-cell{display:flex;gap:3px;align-items:center}
.grades-table .wh-cell input{flex:1 1 0;width:100%}
.note-rows{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.note-row{display:flex;align-items:center;gap:8px}
.note-row .nm{width:64px;flex:0 0 auto;font-size:12px;font-weight:600;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-row .input{flex:1;height:30px;font-size:12px}

/* ===== ② 节点多选（本轮按批注重做） ===== */
.node-list{max-height:330px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:#fcfdff}
.node-row{display:flex;align-items:center;gap:7px;padding:6px 9px;border-bottom:1px solid var(--line2);font-size:12px;cursor:pointer;transition:.1s}
.node-row:last-child{border-bottom:0}
.node-row.can:hover{background:#f2f6ff}
.node-row.on{background:var(--accent2)}
.node-row.no{opacity:.5;cursor:not-allowed}
.node-row input{accent-color:var(--accent);width:14px;height:14px;flex:0 0 auto;margin:0}
.node-row .nochk{width:14px;height:14px;flex:0 0 auto;border:1px dashed var(--ink4);border-radius:3px}
.node-row .id{width:20px;flex:0 0 auto;color:var(--ink4);font-family:Consolas,Menlo,monospace;font-size:10.5px;text-align:right}
.node-row .cls{flex:0 1 auto;min-width:0;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-row.on .cls{color:#1d4ed8;font-weight:600}
.node-row .nf{margin-left:auto;font-size:10px;color:var(--ink4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%;flex:0 1 auto;text-align:right}

/* ===== ④ 被选中节点的参数 ===== */
.node-editors{display:flex;flex-direction:column;gap:9px}
.node-edit{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.node-edit .ne-hd{display:flex;align-items:center;gap:7px;padding:7px 10px;background:#f7f9fd;border-bottom:1px solid var(--line2);font-size:12px}
.node-edit .ne-hd .cid{font-family:Consolas,Menlo,monospace;font-size:10.5px;color:#1d4ed8;background:var(--accent2);border-radius:4px;padding:0 5px;line-height:17px;font-weight:600}
.node-edit .ne-hd b{color:var(--ink);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-edit .ne-hd .tiny{margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.node-edit .ne-bd{display:flex;flex-wrap:wrap;gap:8px 14px;padding:9px 10px}
.ne-fld{display:flex;align-items:center;gap:6px;min-width:0}
.ne-fld .lb{font-size:11.5px;color:var(--ink2);white-space:nowrap;display:flex;align-items:baseline;gap:3px}
.ne-fld .lb i{font-style:normal;font-family:Consolas,Menlo,monospace;font-size:9.5px;color:var(--ink4)}
.ne-fld .input{width:96px;height:27px;font-size:12px;padding:0 6px;flex:0 0 auto}
.ne-fld .vtag{font-size:9.5px;color:var(--ink4);white-space:nowrap}
.ne-fld.same .vtag{color:#9aa6b8}

/* ===== ⑤ 档位列表：一行一档，点编辑展开 ===== */
.glist{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.glist-hd{display:flex;gap:8px;padding:6px 10px;background:#f7f9fd;border-bottom:1px solid var(--line2);font-size:11px;color:var(--ink3)}
.glist-hd span:first-child{flex:1}
.grow{border-bottom:1px solid var(--line2)}
.grow:last-child{border-bottom:0}
.grow.open{background:#fbfcff}
.grow-hd{display:flex;align-items:center;gap:8px;padding:7px 10px}
.grow-hd .gnum{width:16px;flex:0 0 auto;font-size:10.5px;color:var(--ink4);font-family:Consolas,Menlo,monospace;text-align:right}
.grow-hd .gname{flex:1;min-width:0;height:30px;font-size:12.5px;font-weight:600}
.grow-hd .gedit{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:6px;
  border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:11.5px;cursor:pointer;transition:.12s}
.grow-hd .gedit:hover{border-color:var(--accent3);color:#1d4ed8}
.grow-hd .gedit.on{background:var(--accent2);border-color:var(--accent3);color:#1d4ed8;font-weight:600}
.grow-hd .gdel{flex:0 0 auto;height:26px;padding:0 8px;border-radius:6px;color:var(--ink3);font-size:11.5px;cursor:pointer;transition:.12s}
.grow-hd .gdel:hover{background:var(--red2);color:#c0392b}
.grow-bd{padding:2px 10px 12px 34px;border-top:1px dashed var(--line)}
.grow-bd .node-edit{margin-top:8px}
.grow-bd .note-row .nm{width:70px}
.grow-bd .note-row .input{height:28px;font-size:12px}
/* 档位拖拽排序 */
.grow-hd .gdrag{flex:0 0 auto;cursor:grab;color:var(--ink4);font-size:14px;line-height:1;padding:0 2px;user-select:none}
.grow-hd .gdrag:active{cursor:grabbing}
.grow.dragging{opacity:.45}
.grow.dropover{outline:2px dashed var(--accent);outline-offset:-2px;background:#eef4ff}
.grow-hd .gdrag:hover{color:var(--accent)}

/* ===== 参数控件（按类型渲染） ===== */
.pfld{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 190px;max-width:300px}
/* 文字类参数自己占一整行（提示词、文件名前缀这类要打长句） */
.pfld.wide{flex:1 1 100%;max-width:none}
/* 统一基准高度：免得 label 长短不一导致同一行控件上下错位 */
.pfld .plb{min-height:17px}
.pfld .plb{display:flex;align-items:center;gap:4px;min-width:0;flex-wrap:wrap}
.pfld .pn{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.pfld .pk{font-style:normal;font-family:Consolas,Menlo,monospace;font-size:9px;color:var(--ink4);white-space:nowrap}
.pfld .ptype{font-size:9px;line-height:14px;padding:0 5px;border-radius:3px;white-space:nowrap;border:1px solid transparent}
.ptype.t-number{background:#eef4ff;color:#1d4ed8;border-color:#d7e3fb}
.ptype.t-switch{background:#eafaf1;color:#0f6b45;border-color:#cceadd}
.ptype.t-select{background:#fdf2e3;color:#8a5a00;border-color:#f2ddba}
.ptype.t-multi{background:#f5edfd;color:#6d3fa8;border-color:#e3d3f7}
.ptype.t-text,.ptype.t-textarea{background:#f2f4f8;color:var(--ink3);border-color:var(--line)}
.pfld .phint{font-size:9.5px;color:#b07a2a;white-space:nowrap}
.pfld .pctl{min-width:0}
.pfld .input{width:100%;height:28px;font-size:12px;padding:0 7px}
.pfld textarea.input{height:auto;padding:5px 7px;line-height:1.5}

.task-del:hover{background:var(--red2)}
.task-del:disabled{opacity:.4;cursor:not-allowed}
.task-item.sel{background:#fff6f4;border-color:var(--red3)}
.task-item .tsel{width:15px;height:15px;cursor:pointer;accent-color:var(--accent);flex:0 0 auto}

/* ================= 手机 / 平板适配（只调版式，不改功能） ================= */
.sheetbtn{display:none}
.sheet-mask{display:none}
.sheet-hd{display:none}
.navbtn{display:none}      /* 手机上才有：拉起左侧抽屉（能力 / 管理台菜单） */
.side-hd{display:none}     /* 抽屉里的标题栏 */
.side-mask{display:none}   /* 抽屉遮罩 */
.hstat{display:none}       /* 「已连接 · 空闲」里的状态字，只在手机上显示 */
.mico{display:none}        /* 手机上才出现的图标（PC 用字符版，保持原样） */
.mic{display:none}         /* 「批量删除」的图标版 */
.topbar .ico{font-size:14px;line-height:1}
.topbar .ico svg{width:18px;height:18px;display:block}

@media (max-width:820px){
  /* ---------- 骨架：整页变成一屏高的竖列，只有聊天区内部滚动 ---------- */
  .app{height:100vh;height:100dvh;min-height:0;overflow:hidden}
  /* align-items 必须显式给 stretch：桌面那条 grid 规则里的 align-items:start 会留到手机上，
     于是聊天区按 min-content 撑宽（表单那几行能撑到 590px），整块被裁在屏幕外。 */
  .studio{flex:1;min-height:0;display:flex;flex-direction:column;align-items:stretch;width:100%}
  .chat{width:100%;max-width:100%}

  /* ---------- 顶栏：矮一点、按钮图标化，功能一个不少 ---------- */
  .topbar{height:50px;min-height:50px;flex-wrap:nowrap;gap:5px;padding:0 9px;position:sticky}
  .topbar .brand{font-size:13.5px;gap:7px}
  .topbar .brand img{width:20px;height:20px;border-radius:6px}
  .topbar .lbl{display:none}
  .topbar .dico{display:none}
  .topbar .mico{display:inline-flex;align-items:center;justify-content:center}
  .topbar .btn{width:34px;height:34px;padding:0;justify-content:center;border-radius:10px;flex:0 0 auto}
  .topbar .btn .ico{font-size:15px}
  /* 菜单按钮移到最左（豆包那种摆法），logo 跟着排第二 */
  .topbar .navbtn{order:-2}
  .topbar .brand{order:-1}
  /* 健康状态：不再绝对居中。新增「提示词模板」开关后右侧有 4 个按钮，
     绝对居中会压到第 1 个（任务）图标；改为跟随 flex 排布，spacer 挤在它和按钮之间。 */
  .topbar .health{position:static;transform:none;margin:0;
    padding:3px 8px;gap:4px;font-size:10.5px;flex:0 1 auto;min-width:0;max-width:calc(100% - 250px);
    white-space:nowrap;overflow:hidden}
  /* 4 个右侧按钮固定、健康胶囊可收缩，中轴留给 spacer 吸收，互不遮挡 */
  .topbar .spacer{flex:1 1 auto;min-width:0}
  .topbar .health .txt{overflow:hidden;text-overflow:ellipsis}
  /* 手机上「ComfyUI 未连接，请先启动」太长，会把中轴撑歪；只留三个字 */
  .topbar .health .txt{display:none}
  .topbar .health .txt-short{display:inline}
  .topbar .health .hurl{display:none}
  /* 标题栏只报状态，不写描述（描述在抽屉里那一块） */
  .topbar .health .hstat{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#0f6b45;
    background:var(--green2);border-radius:20px;padding:1px 5px;margin-left:0;font-weight:600;flex:0 0 auto}
  .topbar .health .hstat .hsd{width:5px;height:5px;border-radius:50%;background:var(--green);flex:0 0 auto}
  .topbar .health .hstat.busy{color:#8a5a00;background:var(--amber2)}
  .topbar .health .hstat.busy .hsd{background:var(--amber)}
  .topbar .health.off .hstat{display:none}
  .topbar .spacer{flex:1;min-width:0}
  /* 提示词模板开关：手机上只留开关本体，图标做进滑块里 */
  .topbar .pt-top-switch{width:34px;height:34px;padding:0;justify-content:center;border-color:transparent;background:transparent;border-radius:10px}
  .topbar .pt-top-switch .pts-label{display:none}
  .topbar .pt-top-switch .pts-track{width:34px;height:20px;flex-basis:34px}
  .topbar .pt-top-switch .pts-knob{width:16px;height:16px}
  .topbar .pt-top-switch .pts-knob svg{display:block;width:10px;height:10px}
  .topbar .pt-top-switch.on .pts-knob{transform:translateX(14px)}
  .sheetbtn,.navbtn{display:inline-flex}

  /* ---------- 左抽屉：创作台的能力 / 管理台的菜单（豆包那种侧边抽屉） ---------- */
  /* 高度必须显式给 100dvh：只写 top:0;bottom:0 时，抽屉会被内容高度定死（实测只有 435px，
     下半屏是空的），菜单看着像「缺了一块」。 */
  .rail,.admin-nav{
    position:fixed;left:0;top:0;bottom:auto;height:100vh;height:100dvh;
    width:80vw;max-width:308px;max-height:none;
    display:block;background:#fff;z-index:135;border:0;border-right:1px solid var(--line);
    padding:0 10px calc(22px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    box-shadow:16px 0 44px rgba(10,18,35,.20);
    transform:translateX(-104%);transition:transform .27s cubic-bezier(.4,0,.2,1);visibility:hidden}
  .app.nav-open .rail,.admin.nav-open .admin-nav{transform:none;visibility:visible}
  .side-hd{display:flex;align-items:center;gap:8px;padding:14px 2px 12px;border-bottom:1px solid var(--line2);
    margin-bottom:8px;position:sticky;top:0;background:#fff;z-index:2}
  .side-hd b{flex:1;font-size:14.5px}
  .side-x{width:30px;height:30px;border-radius:9px;background:#f4f6fa;color:var(--ink2);font-size:13px;
    display:flex;align-items:center;justify-content:center}
  .side-mask{display:block;position:fixed;inset:0;background:rgba(12,18,32,.42);z-index:130;opacity:0;
    pointer-events:none;transition:opacity .24s}
  .app.nav-open .side-mask,.admin.nav-open .side-mask{opacity:1;pointer-events:auto}
  /* 抽屉里的能力项：整行竖排（横向胶囊在窄屏上要滑半天才找得到） */
  .rail .group{display:flex;padding:10px 8px 4px;font-size:11px}
  .rail .item{display:flex;width:auto;border:1px solid transparent;border-radius:9px;background:transparent;
    padding:10px 11px;margin:0 0 2px;font-size:13.5px;min-height:auto;box-shadow:none}
  .rail .item .em{width:20px;font-size:15px}
  .rail .item .tag{display:none}
  .rail .item.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .rail .tip{margin:8px 2px 0}

  /* ---------- 聊天区：内部滚动，输入区永远贴底 ---------- */
  .chat{flex:1;min-height:0;border-right:0}
  .chat-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 14px;-webkit-overflow-scrolling:touch}
  .chat-inner{max-width:none;gap:12px}
  .composer{position:relative;bottom:auto;flex:0 0 auto;padding:9px 10px calc(9px + env(safe-area-inset-bottom,0px));z-index:18;
    max-height:50dvh;display:flex;flex-direction:column}
  .composer-inner{max-width:none;width:100%;margin:0;display:flex;flex-direction:column;min-height:0}
  /* 输入框最高占半屏。滚动只发生在中间那块内容区（.sheetbody），底部工具栏永远露在外面——
     角色设定图那一版有 5 行分段按钮 + 描述 + 风格，不限高会把聊天区整个吃掉。 */
  .composer .inputbox{max-height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .composer .inputbox .sheetbody{flex:1 1 auto;min-height:0;min-width:0;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch}
  .composer .inputbox .foot{flex:0 0 auto}
  .composer .inputbox .sheetbody::-webkit-scrollbar{width:4px}
  .composer .inputbox .sheetbody::-webkit-scrollbar-thumb{background:rgba(120,132,152,.45);border-radius:4px}
  .composer .inputbox .sheetbody::-webkit-scrollbar-track{background:transparent}
  .parambar{gap:6px;row-gap:8px;margin-bottom:7px}
  /* 分段按钮在窄屏上要能自己换行，否则整行被撑宽、右边的说明文字被切掉 */
  .sheetbar>.seg,.seg{max-width:100%;flex-wrap:wrap}
  .modepick button{height:28px;padding:0 11px}
  .parambar .grades{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .parambar .grades::-webkit-scrollbar{display:none}
  .grade{height:28px;padding:0 10px}
  .grade-note{display:none}
  .scope-hint{display:none}
  .msg-u{max-width:88%}
  /* 输入区脚注在手机上太挤：只留「上传」和发送，其余提示去掉 */
  .inputbox .foot .kbdhint,.inputbox .foot #pickHint,.inputbox .foot #emptyHint{display:none}
  .rail .item .tag{display:none}
  .job .head{flex-wrap:wrap;row-gap:4px}
  .job .foot{flex-wrap:wrap;row-gap:6px}
  .job .foot .btn{margin-left:0}

  /* ---------- 右抽屉：状态与任务，从右侧滑出（点顶栏图标拉起，点遮罩关） ---------- */
  .drawer{position:fixed;top:0;right:0;bottom:0;left:auto;grid-column:auto;height:100dvh;max-height:none;
    width:34vw;min-width:300px;max-width:88vw;overflow:hidden;overscroll-behavior:contain;
    background:#fff;z-index:120;border:0;border-left:1px solid var(--line);border-radius:0;
    padding:6px 14px calc(22px + env(safe-area-inset-bottom,0px));
    box-shadow:-16px 0 46px rgba(10,18,35,.22);
    transform:translateX(104%);transition:transform .27s cubic-bezier(.4,0,.2,1);visibility:hidden;
    display:flex;flex-direction:column}
  .drawer .drawer-fixed{background:#fff}
  .drawer .drawer-scroll{min-height:0}
  .sheet-hd{display:flex;align-items:center;gap:8px;padding:14px 0 12px;border-bottom:1px solid var(--line2);margin-bottom:10px}
  .sheet-hd b{flex:1;font-size:14px}
  .sheet-x{width:30px;height:30px;border-radius:9px;background:#f4f6fa;color:var(--ink2);font-size:13px;
    display:flex;align-items:center;justify-content:center}
  .app.sheet-open .drawer{transform:none;visibility:visible}
  .sheet-mask{display:block;position:fixed;inset:0;background:rgba(12,18,32,.44);z-index:110;opacity:0;
    pointer-events:none;transition:opacity .24s}
  .app.sheet-open .sheet-mask{opacity:1;pointer-events:auto}
  /* 「全选 / 批量删除」在手机上是图标按钮，不要文字 */
  .seltasks{width:34px;height:32px;padding:0;justify-content:center;border-radius:9px}
  .seltasks .lbl{display:none}
  .task-del{width:34px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;
    font-size:14px;border-radius:9px;position:relative}
  .task-del .lbl{display:none}
  .task-del .mic{display:inline-flex;align-items:center;justify-content:center}
  .task-del .mic i{font-style:normal;position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;padding:0 3px;
    border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;line-height:15px;text-align:center}

  /* ---------- 历史 / 管理台：标题不再被挤成竖排 ---------- */
  .admin-main{padding:14px 12px 48px}
  .admin-main h2{font-size:16.5px;line-height:1.35}
  .admin-main .sub{margin-bottom:12px}
  .spread{flex-wrap:wrap;align-items:flex-start;gap:10px}
  .spread>.gtitle,.spread>div:first-child{flex:1 1 100%;min-width:0}
  .row{flex-wrap:wrap;gap:8px}
  .ghead .gfilters{width:100%}
  .ghead .gfilters .input{flex:1 1 96px;width:auto;min-width:0;height:34px}
  .ghead .gfilters .btn{flex:1 1 auto;justify-content:center}
  .ghead .gall{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--line);
    border-radius:8px;background:#fff;font-size:12.5px;white-space:nowrap}

  /* 管理台：左侧导航和创作台一样是左抽屉（上面的 .rail,.admin-nav 规则已把它移出文档流） */
  .admin-body{display:block}
  .admin-nav .item{display:flex;width:auto;margin:0 0 2px;background:transparent;border:1px solid transparent;
    border-radius:9px;padding:10px 11px;font-size:13.5px;gap:9px;white-space:normal}
  .admin-nav .item.on{background:var(--accent);border-color:var(--accent)}
  .admin-nav .hr{display:block;margin:10px 8px}
  .admin-nav .tiny{white-space:normal;margin:0;font-size:11px}
  /* 「档位表」子菜单：抽屉里也保持缩进 */
  .nav-sub{margin:0 0 6px 12px;padding-left:9px}
  .nav-sub .sitem{padding:9px;font-size:12.5px}
  /* 能力行：图标 + 文案在左，开关和「配置」在右，一行放得下，卡片更矮、一屏更多 */
  .cap-row{flex-wrap:nowrap;align-items:center;gap:8px;padding:9px 11px;margin-bottom:8px}
  .cap-row>.em,.cap-row>.ic{width:30px;height:30px;border-radius:8px;font-size:15px;flex:0 0 auto}
  .cap-row>div{flex:1 1 auto!important;min-width:0}
  .cap-row .chip{height:18px;padding:0 6px;font-size:10px}
  /* 卡片内容固定两行：第一行「名称 + 状态 + 档位数」，第二行描述；右侧留给开关和「配置」 */
  .cap-row .row{flex-wrap:nowrap!important;overflow:hidden;gap:6px!important}
  .cap-row .row b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:13px}
  .cap-row .row>span.tiny{flex:0 0 auto;white-space:nowrap}
  .cap-row .main>div.tiny.muted{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cap-row .capoff{display:none}          /* 状态 chip 已经写了「未配置」，右边这句去掉 */
  .cap-row .btn{height:26px;padding:0 9px;font-size:11.5px;margin-left:0}
  .cap-row .switch{margin-left:0;flex:0 0 auto}
  /* 宽表格整块横向滚动，而不是把列压扁 */
  .panel{overflow-x:auto;min-width:0;max-width:100%}
  .grades-table{min-width:520px}
  /* 档位页的「文件/参数节点 | 参数详情」两栏，手机上必须竖排，否则右栏只剩几十像素。
     用 minmax(0,1fr)：1fr 的最小值是 min-content，会把整页撑宽导致手机自动缩小。 */
  .glayout{grid-template-columns:minmax(0,1fr)!important;gap:12px!important}
  .glayout>.panel{position:static!important}
  .node-edit .ne-bd{gap:8px 12px}
  .ne-fld .input{width:84px}

  /* 档位表：窄屏别把档位名挤成一列竖字；出图尺寸 chip 允许换行 */
  .grow-hd{flex-wrap:wrap;row-gap:6px;padding:9px 10px}
  .grow-hd .gnum{width:14px}
  .grow-hd .gname{flex:1 1 auto;min-width:104px}
  .grow-hd .gname-txt{flex:1 1 auto;min-width:104px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grow-hd .gcopy{max-width:150px}
  .grow-hd .geff{margin-left:0;max-width:100%}
  .grow-hd .gsp{display:none}
  .grow-hd .gedit{margin-left:auto}
  .grow-bd{padding:2px 10px 12px}
  /* 页头按钮：保存靠右，返回列表留在左边 */
  .admin-main .spread>.row{width:100%;justify-content:space-between}
  .pfoot .btn{margin-left:auto}
  /* 「已实测组合」表格：手机上竖排成卡片，别让单元格挤成竖字 */
  .presets thead{display:none}
  .presets,.presets tbody,.presets tr,.presets td{display:block;width:100%}
  .presets tr{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;margin-bottom:9px}
  .presets tr:hover td{background:transparent}
  .presets td{border:0;padding:3px 0;display:flex;align-items:baseline;gap:10px;font-size:12px;white-space:normal}
  .presets td::before{content:attr(data-l);flex:0 0 52px;color:var(--ink3);font-size:11px}
  .presets td:last-child{padding-top:8px;justify-content:flex-end}
  .presets td:last-child::before{display:none}
  .modal .m-body img{max-height:56dvh;object-fit:contain;margin:0 auto;display:block}

  /* ---------- 历史卡片：手机上两列更像相册 ---------- */
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .gallery .card>div:last-child{padding:7px 9px!important}
  .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr 1fr}

  /* ---------- 弹层 / 提示 ---------- */
  .modal-mask{padding:12px;align-items:flex-end;z-index:200}   /* 必须高于底部抽屉(120)，否则在抽屉里点「批量删除」弹窗会被盖住 */
  .wizard-mask{z-index:210}
  .modal{max-height:88dvh;border-radius:16px}
  .modal .m-head{padding:16px 18px 12px}
  .modal .m-body{padding:16px 18px}
  .modal .m-foot{padding:12px 18px;flex-wrap:wrap}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 92px);max-width:86vw;text-align:center}
}

@media (max-width:480px){
  .topbar .bname{display:none}          /* 太窄时只留 logo，把位置让给按钮 */
  .modedis{display:none}                /* 模式提示在手机上占一整行，去掉 */
  .parambar .grade-note{display:none}
  .editbar,.scope-hint{display:none}
}

/* ---------- 触屏设备：hover 才出现的东西必须常驻，否则根本点不到 ---------- */
@media (hover:none){
  .gcheck{opacity:1}
  .gdelone{opacity:1}
  .ref-thumb .at{opacity:1}
  .tile .acts{opacity:1;background:linear-gradient(180deg,rgba(10,16,28,0) 62%,rgba(10,16,28,.62))}
  .grow-hd .gdrag{cursor:default}
}

/* ================= 角色设定图：创作台表单 + 管理台模板 ================= */

/* 表单卡片：沿用 .inputbox 的强调边框，内部按「版式 / 画法 / 参考 / 角色 / 风格」分行 */
.sheetbox{padding:6px 10px 8px}
.sheetbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 2px;min-height:34px}
.sheetbar + .sheetbar{border-top:1px dashed var(--line2)}
.sheetbar .slb{font-size:11.5px;color:var(--ink3);flex:0 0 auto;min-width:26px;letter-spacing:.02em}
/* 分段按钮：比画质档更小一档，正好放进输入区 */
.seg{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:8px;background:#eef1f7;border:1px solid #e6eaf2}
.segb{height:24px;padding:0 9px;border:0;border-radius:6px;background:transparent;color:var(--ink2);
  font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;transition:.12s}
.segb:hover{color:var(--ink)}
.segb.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(20,30,50,.1)}
.segb.dis{color:var(--ink4);background:#f4f6fa;border:1px dashed var(--line);cursor:not-allowed;opacity:.7}
.segb.dis:hover{color:var(--ink4)}
.segx{font-style:normal;font-size:9.5px;color:var(--ink4);margin-left:5px}
.segb.on .segx{color:var(--accent)}
/* 风格等下拉：必须和旁边的自定义输入框(.segtext)一样高。
   promptlib.css 在后加载且有全局 `.input{height:34px}`（无命名空间），
   同特异性下会盖掉本页 26px，导致「下拉矮、输入框高」。这里统一用
   `.input.xxx` 双类选择器提高特异性（0,2,0 > 0,1,0），保证两者恒等高。 */
.input.segsel,select.segsel{height:26px;width:auto;min-width:132px;max-width:260px;font-size:12px;padding:0 26px 0 8px;flex:0 0 auto}
.input.segtext{height:26px;font-size:12px;padding:0 8px;flex:1 1 200px;min-width:140px;width:auto}
.sheetchar{width:100%;border:0;outline:none;resize:vertical;font:inherit;font-size:13.5px;line-height:1.65;
  min-height:68px;max-height:200px;padding:7px 3px;background:transparent;color:var(--ink)}
.sheetchar::placeholder{color:var(--ink4)}
.warnhint{font-size:10.5px;color:#8a5a00;background:#fff8ec;border:1px solid #f0dcb8;border-radius:5px;padding:1px 6px}
/* 「看完整提示词」面板 */
.pvbox{margin-top:4px;border-top:1px dashed var(--line2);padding-top:8px}
.pvhead{display:flex;align-items:baseline;gap:8px;font-size:11.5px;margin-bottom:6px;color:var(--ink2)}
.pvhead.bad{color:#a83a20}
.pvbox pre{margin:0;max-height:210px;overflow:auto;background:#f7f9fd;border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;font-family:inherit;font-size:11.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word;color:#39445a}
/* 卡片上的摘要行 */
.promptmeta{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;flex-wrap:wrap}
.linkbtn{font-size:11.5px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:#2359e0}
.promptfull{margin:0;max-height:56vh;overflow:auto;background:#f7f9fd;border:1px solid var(--line);border-radius:9px;
  padding:12px 14px;font-family:inherit;font-size:12px;line-height:1.85;white-space:pre-wrap;word-break:break-word;color:#39445a}

/* 管理台「设定图模板」 */
.sheet-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fcfdff}
.lcard .chip{height:20px;font-size:10.5px}
.lmeta{display:flex;align-items:center;gap:7px;margin-top:5px}
.sheet-block{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:8px;background:#fcfdff}
.sheet-block .bh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.sheet-block .bh .mono{font-weight:400;color:var(--ink4);font-size:10px}
.sheet-block textarea{width:100%;resize:vertical;border:1px solid var(--line);border-radius:7px;padding:8px 10px;
  font:inherit;font-size:12px;line-height:1.8;color:#2b3444;background:#fff;outline:none}
.sheet-block textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.1)}
.style-row{display:flex;gap:8px;margin-bottom:6px;align-items:center}
.style-row .sname{width:120px;flex:0 0 auto}
.style-row .input{height:30px;font-size:12px}
.style-row [data-stt]{flex:1;min-width:0}

@media (max-width:820px){
  .sheetbar{gap:6px}
  .input.segsel,select.segsel,.input.segtext{height:28px}
  .sheetchar{min-height:60px}
  .style-row{flex-wrap:wrap}
  .style-row .sname{width:100%}
  .sheet-cards{grid-template-columns:1fr}
}
/* 1.03 场景设定图四个参考图槽位 */
.ext-slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 10px}
.ext-slot{min-width:0;border:1px dashed var(--line);border-radius:10px;padding:8px;background:#fcfdff}
.ext-slot.on{border-style:solid;border-color:#8fb0ff;background:#f7faff}
.ext-slot.disabled{opacity:.48;background:#f5f6f8}
.ext-slot .slot-t{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:6px}
.ext-slot .slot-t b{font-size:11.5px;color:var(--ink2)}
.ext-slot img{width:100%;height:62px;object-fit:contain;border-radius:7px;background:#eef1f6;display:block;margin-bottom:6px}
.ext-slot .slot-acts{display:flex;gap:4px;margin-bottom:6px}
.ext-slot .slot-acts .btn{padding:3px 7px;height:auto;font-size:10.5px}
.ext-slot>.btn{width:100%;height:28px;font-size:11px;margin-bottom:5px}
.ext-slot .tiny{font-size:10px;line-height:1.5;display:block}
@media (max-width:820px){.ext-slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 1.03 宫格分镜故事板：左侧小宫格单选 + 右侧单个提示词输入框 */
.board-wrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:stretch;margin:8px 0 10px}
.board-grid{display:grid;gap:6px;align-content:start;background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:8px}
.board-grid.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.board-grid.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.board-cell{height:46px;padding:0 4px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink2);
  font-size:12px;font-weight:650;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.board-cell small{font-size:9px;font-weight:400;color:#8b95a5}
.board-cell:hover{border-color:#8fb0ff;background:#f7faff}
.board-cell.on{border-color:#2f6bff;background:#2f6bff;color:#fff;box-shadow:0 2px 8px #2f6bff33}
.board-cell.on small{color:#d9e6ff}
.board-cell.blank:not(.on){border-style:dashed;background:#fcfdff}
.board-side{min-width:0;display:flex;flex-direction:column;gap:6px}
.board-side .board-tip{display:flex;align-items:center;gap:6px;font-size:11px;color:#667085}
.board-text{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 11px;
  font:inherit;font-size:12.5px;line-height:1.7;color:var(--ink);background:#fff;outline:none}
.board-text:focus{border-color:#2f6bff;box-shadow:0 0 0 3px #2f6bff14}
.board-text::placeholder{color:#a8b0bc}
@media (max-width:820px){
  .board-wrap{grid-template-columns:1fr}
  .board-grid{padding:6px}
  .board-cell{height:40px}
  .board-text{min-height:110px}
}
/* 组合档位表已改为与「图片生成」档位表同构（pageComboGrades）：
   复用 .glayout / .node-list / .node-editors / .addbar / .glist / .grow / .effbox
   与顶部 .sheetbar/.seg 分段按钮，不再需要单独的 .combo-* / .gtable 样式。 */

/* ---------- 1.03 场景 / 道具设定图：版式与子选项 ---------- */
/* 版式最多 5 个、子选项最多 4 个。窄屏上折行会把输入区顶得很高，
   所以这两行改成「一行横滑」，手指左右划就能看到最后一个。 */
.ext-seg{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;max-width:100%;min-width:0;flex:0 1 auto}
/* 窄屏那条 `.sheetbar>.seg{flex-wrap:wrap}` 的优先级更高，这里显式盖回来 */
.sheetbar>.seg.ext-seg{flex-wrap:nowrap}
.ext-seg::-webkit-scrollbar{display:none}
.ext-seg .segb{flex:0 0 auto}
@media (max-width:820px){
  /* 这两个能力的表单比角色设定图长（模式 + 版式 + 子选项 + 4 个槽位 + 档位 + 风格），
     50dvh 只剩一条缝，改成最高 74dvh，中间照旧内部滚动、底部工具栏不动。 */
  .composer.ext{max-height:min(74dvh,680px)}
  /* 版式行改成横滑以后，它的 min-content 会把整条 inputbox 撑宽（溢出 20px、右边按钮被切）。
     逐层把 min-width 放开，宽度就由容器说了算，横滑只发生在 .seg 内部。 */
  .composer.ext .composer-inner{width:100%;margin:0;min-width:0}
  .composer.ext .inputbox,.composer.ext .sheetbar{min-width:0}
  .composer.ext .sheetbody{padding-bottom:2px}
  .composer.ext .sheetbar{padding:4px 2px;min-height:30px;gap:6px}
  /* 版式全是 16:9，窄屏上每个按钮里再带一遍「16:9」会把 5 个版式挤到横滑；
     去掉这枚小字，5 个版式一行放得下。 */
  .composer.ext .ext-seg .segx{display:none}
  .composer.ext .ext-seg .segb{padding:0 8px}
  .composer.ext .sheetbar>.tiny.muted{display:none}      /* 行尾说明在窄屏上只会挤掉按钮 */
  .ext-slots{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:6px 0 8px}
  .ext-slot{padding:7px 8px;border-radius:9px;min-height:0}
  .ext-slot .slot-t{margin-bottom:4px;gap:4px}
  .ext-slot .slot-t b{font-size:11px}
  .ext-slot img{height:52px;margin-bottom:5px}
  .ext-slot .tiny{display:none}                          /* 槽位长说明收进桌面端 */
  .ext-slot>.btn{height:26px;font-size:11px;margin-bottom:0}
  /* 手指点得准一点：分段按钮与槽位按钮在窄屏上抬到 30px 高 */
  .composer.ext .ext-seg .segb{min-height:30px}
  .ext-slot>.btn{height:30px}
  .ext-foot-hint{display:none}
  .composer.ext .foot{flex-wrap:wrap;row-gap:6px}
  .composer.ext .sheetchar{min-height:56px}
  /* 档位表的版式行：手机上把「16:9」小字去掉、改成一行横滑，避免最后一个版式被挤到第二行 */
  .admin-seg{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0}
  .admin-seg::-webkit-scrollbar{display:none}
  .admin-seg .segb{flex:0 0 auto}
  .admin-seg .segx{display:none}
}

/* ---------- 1.04 视频 / 音频表单 ---------- */
.vmodes{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.vmode{height:28px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;color:var(--ink2);transition:.12s;white-space:nowrap}
.vmode:hover{border-color:#c9d3e3;background:#fbfcfe}
.vmode.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.vmode.dis{color:var(--ink4);background:#f6f8fb;border-style:dashed}
.vmode.dis:hover{border-color:var(--line);background:#f6f8fb}
.vopt{display:inline-flex;align-items:center;gap:4px;padding:2px;border-radius:9px;background:#eef1f7;border:1px solid #e6eaf2}
.vopt-n{font-size:11px;color:var(--ink3);padding:0 6px 0 4px;white-space:nowrap}
.vseg{height:24px;padding:0 9px;border-radius:7px;background:transparent;font-size:12px;color:var(--ink2);white-space:nowrap}
.vseg:hover{color:var(--ink)}
.vseg.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 4px rgba(20,30,50,.10)}
.vsize{font-size:11.5px;color:var(--ink4);white-space:nowrap}
/* 需求6：视频时长——数值框(左) + 滑条(右)，实时同步，框里精度 0.01 */
.vdurbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.vdurbar::-webkit-scrollbar{display:none}
.input.vdur-num{width:74px;flex:0 0 auto;height:28px;text-align:center;font-variant-numeric:tabular-nums}
.vdur-unit{flex:0 0 auto}
.vdur-range{flex:1 1 130px;min-width:110px;max-width:280px;accent-color:var(--accent);height:24px;cursor:pointer}
.vdur-meta{flex:0 0 auto;white-space:nowrap;margin-left:auto}
.vg-new{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.vg-new .cvf select{min-width:92px}
.vslots{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.vslots.two{align-items:flex-start}
.vslots.two>.vslot{width:104px;height:104px}
.vadds{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vadd{height:26px;padding:0 10px;border-radius:7px;border:1px dashed var(--line);background:#fafbfe;
  font-size:12px;color:var(--ink2)}
.vadd:hover{border-color:var(--accent3);color:var(--accent);background:var(--accent2)}
.vslot{width:84px;height:84px;border:1.4px dashed var(--line);border-radius:9px;background:#f8fafd;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:0 0 auto;
  position:relative;overflow:hidden;padding:0}
.vslot:hover{border-color:var(--accent3);background:var(--accent2)}
.vslot .vs-ic{font-size:17px}
.vslot .vs-lb{font-size:11px;color:var(--ink2)}
.vslot .vs-hint{font-size:9.5px;color:var(--ink4)}
.vslot.has{border-style:solid;border-color:var(--line);background:#eef2f8}
.vslot.has img,.vslot.has video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vslot.has .vs-audio{font-size:24px}
.vslot .vs-lb2{position:absolute;left:0;right:0;bottom:0;padding:1px 4px;font-size:9.5px;color:#fff;
  background:linear-gradient(0deg,rgba(10,16,28,.72),transparent);text-align:left}
.vslot .vs-token{position:absolute;left:3px;top:3px;font-size:9px;color:#fff;background:rgba(10,16,28,.6);
  border-radius:4px;padding:0 4px}
.vslot .at{position:absolute;right:3px;bottom:3px;width:18px;height:18px;border-radius:50%;
  background:#2f6bff;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.vslot .x{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;
  background:rgba(15,20,32,.65);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.vgrid{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:2px;border-radius:9px;
  background:#eef1f7;border:1px solid #e6eaf2;max-width:420px}
.vgrid-hint{font-size:10.5px;color:var(--ink4);padding:0 6px;line-height:1.4}
.vcells{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-bottom:6px}
.vcell{display:flex;flex-direction:column;gap:2px}
.vcell span{font-size:10.5px;color:var(--ink3)}
.vcell .input{height:28px;font-size:12px}
.vlyrics{width:100%;border:1px dashed var(--line2);border-radius:8px;padding:6px 8px;font-size:12.5px;
  resize:vertical;min-height:38px;outline:none;background:#fbfcfe;line-height:1.6}
.vlyrics:focus{border-color:var(--accent3);background:#fff}
select.vsmall{width:auto;height:28px;font-size:12px;padding:0 26px 0 8px}
/* 音频成品：一条播放器占满整行 */
.tile.audio-tile{aspect-ratio:auto;padding:12px 12px 8px;background:linear-gradient(135deg,#f7f9ff,#eef3fb);display:flex;flex-direction:column;gap:8px}
.atile-hd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);min-width:0}
.atile-hd .aname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atile-ft{display:flex;align-items:center;gap:6px}
.atile-ft button{width:24px;height:24px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:11px}
@media (max-width:820px){
  .vopt .vseg{padding:0 7px;font-size:11.5px}
  .vsize{display:none}

/* ---------- 1.04 左右栏折叠（任何尺寸都支持；手机以外默认展开） ---------- */
.studio.rail-min{--railw:58px}
.studio.drawer-min{--draww:58px}
.rail-min-btn{position:absolute;top:10px;right:6px;width:22px;height:22px;border-radius:6px;
  border:1px solid var(--line);background:#fff;color:var(--ink3);font-size:10px;line-height:1;
  display:flex;align-items:center;justify-content:center;z-index:3}
.rail-min-btn:hover{color:var(--accent);border-color:var(--accent3);background:var(--accent2)}
/* 桌面/平板上能力栏是常驻一栏，需要 relative 给折叠按钮定位；
   手机上它是从左边滑出的固定抽屉，这里绝不能覆盖成 relative —— 一旦进了文档流，
   它会把整列高度吃光，聊天区和画布都变成 0 高（1.04 实测踩过）。 */
@media (min-width:821px){
  /* 需求15：桌面能力栏必须紧贴顶栏、铺满整列。
     之前从 sticky 改成 relative 时忘了清掉 top:52px，整栏被额外下移 52px；
     同时没有固定高度，内容少时下半截露出 body 灰底，形成顶部/底部两块多余灰色。 */
  .rail{position:relative;top:0;height:calc(100vh - 52px);max-height:calc(100vh - 52px)}
  .rail .side-hd{padding-right:26px}
}
.studio.rail-min .rail{padding-left:6px;padding-right:6px}
.studio.rail-min .rail .group,
.studio.rail-min .rail .item .nm,
.studio.rail-min .rail .item .tag,
.studio.rail-min .rail .tip{display:none}
.studio.rail-min .rail .item{justify-content:center;padding:8px 0}
.studio.rail-min .rail .item .em{width:auto;font-size:16px}
.drawer-min-btn{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:#fff;
  color:var(--ink3);font-size:10px;display:flex;align-items:center;justify-content:center}
.drawer-min-btn:hover{color:var(--accent);border-color:var(--accent3);background:var(--accent2)}
.studio.drawer-min .drawer{padding:10px 6px}
.studio.drawer-min .drawer-fixed,
.studio.drawer-min .drawer-scroll,
.studio.drawer-min .drawer .sheet-hd b{display:none}
.drawer-stub{display:none;flex-direction:column;align-items:center;gap:10px;padding-top:4px}
.studio.drawer-min .drawer-stub{display:flex}
.drawer-stub .ds-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.drawer-stub .ds-dot.busy{background:var(--amber)}
.drawer-stub .ds-n{font-size:11px;color:var(--ink2);font-weight:700}
.drawer-stub .ds-lb{font-size:10px;color:var(--ink3);writing-mode:vertical-rl;letter-spacing:.1em}
@media (max-width:820px){
  .studio.rail-min .rail .item .nm{display:inline}
  .studio.rail-min{--railw:172px}
  .studio.drawer-min{--draww:280px}
  .rail-min-btn,.drawer-min-btn{display:none}
}

/* ---------- 1.04 任务栏：勾选框对齐 + 整行可选 ---------- */
.ti-top .tsel{width:14px;height:14px;margin:0;flex:0 0 auto;accent-color:var(--accent);
  position:relative;top:0;vertical-align:middle;cursor:pointer}
.task-item .ti-top{align-items:center;gap:7px}
.task-item .t{line-height:1.35}
.task-thumbs{padding-left:21px}
.task-item{cursor:pointer}
.task-item.sel{background:#fff;border-color:var(--accent3)}
.tjump{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);background:#fff;
  color:var(--ink3);font-size:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.tjump:hover{color:var(--accent);border-color:var(--accent3);background:var(--accent2)}
.task-item .tdel{position:static;transform:none;flex:0 0 auto}
/* 需求14：左侧 checkbox 与右侧 定位/✕ 各自竖排成列、严格对齐 */
.task-item .ti-top input.tsel{width:15px;height:15px;flex:0 0 15px;margin:0;accent-color:var(--accent)}
.task-item .ti-top>.dot{flex:0 0 8px}
.task-item .ti-top .t{flex:1 1 auto;min-width:0}
.task-item .ti-acts{margin-left:auto;display:flex;gap:6px;align-items:center;flex:0 0 auto;justify-content:flex-end}
/* 需求 6：.task-item 在窄屏是纵向 flex，子项默认按内容宽度居中收缩，
   导致每行的 checkbox/定位/✕ 各自错开；这里强制撑满整行，列的竖排才严格对齐 */
.task-item>.ti-top,.task-item>.task-thumbs{width:100%;box-sizing:border-box}
.task-item>.ti-top{display:flex}
.task-item{padding-right:8px}       /* 清掉 1.03 残留给绝对定位 ✕ 留的 30px，让按钮贴近右边 */
.task-item .ti-acts{width:58px}
.task-item .ti-acts .tdel{position:static;transform:none}
.task-item.jump-flash{animation:jumpFlash 1s ease-in-out 2}
@keyframes jumpFlash{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 4px rgba(47,107,255,.28)}}

/* ---------- 1.04 图片生成：画法 / 风格 ---------- */
.imgstyle{gap:8px}
.imgstyle .vopt{padding:2px 4px}
.input.vsmall{width:auto;height:28px;font-size:12px;padding:0 26px 0 8px}
.input.vsmall.grow{flex:1;min-width:160px;padding-right:8px}

/* 收起把手默认（桌面端）不显示；移动端在下方 media 块内打开 */
.fold-handle{display:none}

/* ================================================================
   移动端统一布局（需求 3/4/5/6）—— 仅 max-width:820px 生效，桌面端不受影响
   ================================================================ */
@media (max-width:820px){
  /* --- 需求3：压缩空状态欢迎区（视频/音频页顶部那块✨标题+说明的大片空白）---
     .chat-scroll 是 flex:1，.empty 原本 padding:60px + 内联 padding-top:36px 且垂直居中，
     移动端会把整个聊天区撑成一大片空白。改成贴顶、小内边距、不居中。 */
  .chat-scroll .empty{padding:16px 12px 12px !important;justify-content:flex-start !important;gap:8px}
  .chat-scroll .empty>div[style*="font-size:34"]{font-size:26px !important;line-height:1.2}
  /* 空状态里的示例提示词 chip 是 nowrap 长句，会把聊天区撑出横向滚动条：
     手机端允许换行、限宽，并让外层 .row 的 min-width 可以收缩 */
  .chat-scroll .empty{max-width:100%;min-width:0}
  .chat-scroll .empty .row{max-width:100% !important;min-width:0;flex-wrap:wrap}
  .chat-scroll .empty .row .chip{max-width:100%;height:auto;min-height:24px;white-space:normal;
    text-align:left;line-height:1.5;padding:4px 10px;word-break:break-word;overflow-wrap:anywhere}

  /* --- 需求5：所有分段切换控件统一到最小高度 24px ---
     桌面最小的是 .segb=24px；移动端 856/859 行却把 grade/modepick 提到 28px。
     这里用 !important 统一拉回 24px，覆盖所有同类分段按钮。 */
  .segb,.grade,.modepick button,.vopt,.imgstyle .vopt,
  .composer .seg .segb,.sheetbar .seg .segb,.ext-seg .segb{
    height:24px !important;min-height:24px !important;line-height:22px !important;
    padding:0 8px !important;font-size:11.5px !important;
  }
  .seg,.modepick,.imgstyle .vopt{padding:2px !important}

  /* --- 需求4：所有页面移动端「输入部分」统一高度 + 内容超出内部滚动 ---
     参照「视频生成」页移动端：描述编辑区固定为约 4 行高，内容多了在编辑区内部出现滚动条。
     .editor 是 contenteditable 描述区（图片/视频/设定图/画布节点通用）；
     .sheetchar / .extText / #extText 是设定图的 textarea 描述区；
     .board-text 是故事板描述区。统一固定高度 + overflow-y:auto。
     —— 高度基准：视频页那个「刚好好放几行、超出滚动」的观感，取 96px。 */
  .composer .inputbox .editor,
  .cnode .inputbox .editor,
  .inputbox .editor{
    height:96px !important;min-height:96px !important;max-height:96px !important;
    overflow-y:auto !important;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  }
  /* textarea 描述区同样处理 */
  .inputbox textarea.sheetchar,
  .inputbox textarea#extText,
  .inputbox .board-text,
  .inputbox textarea{
    height:96px !important;min-height:96px !important;max-height:96px !important;
    overflow-y:auto !important;resize:none;-webkit-overflow-scrolling:touch;
  }
  /* 输入区整体限高：参数行 + 96px 编辑区 + 底部栏，内容多的行区（如「已引用」长提示）内部滚动 */
  .composer{max-height:min(52dvh,420px)}
  .composer .inputbox .sheetbody{max-height:min(46dvh,360px)}

  /* 统一编辑区滚动条样式（像截图里那种细滚动条） */
  .inputbox .editor::-webkit-scrollbar,
  .inputbox textarea::-webkit-scrollbar,
  .sheetbody::-webkit-scrollbar{width:4px}
  .inputbox .editor::-webkit-scrollbar-thumb,
  .inputbox textarea::-webkit-scrollbar-thumb,
  .sheetbody::-webkit-scrollbar-thumb{background:rgba(120,132,152,.5);border-radius:4px}

  /* --- 需求6：移动端输入区「收起/展开」把手 --- */
  .fold-handle{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
    border:0;background:transparent;color:var(--ink3);font-size:11px;line-height:1;
    padding:5px 0 7px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .fold-handle .fold-bar{display:block;width:34px;height:3px;border-radius:3px;background:#c7d0de}
  .fold-handle .fold-txt{font-size:10.5px}
  /* 折叠态：隐藏中间编辑内容，仅留把手与底部工具栏，卡片收缩到内容高度 */
  .inputbox.folded .sheetbody{display:none !important}
  .inputbox.folded{padding-bottom:6px;height:auto !important;max-height:none !important}
  .inputbox.folded .foot{border-top:0;margin-top:0;padding-top:2px}
  /* 手机端收起态：卡片铺满屏宽，底部工具栏（发送那一排）整排隐藏，只剩「展开输入」一行 */
  .composer .inputbox.folded{width:100%;max-width:100%}
  .composer .inputbox.folded .foot{display:none !important}

  /* --- 修复横向溢出：flex 列子项默认 min-width:auto 会被宽内容撑破视口 ---
     视频页 7 个模式按钮总宽 600px+，把 .composer-inner 从 390 撑到 443，
     导致整个输入卡片、编辑器、发送按钮整体右移出屏。让所有中间层可收缩。 */
  .composer-inner,.parambar,.vparambar,.vmodes,.grades,.sheetbar,.vdurbar,
  .composer .inputbox,.composer .inputbox .sheetbody{min-width:0;max-width:100%}
  .composer,.chat{overflow-x:hidden}
  .vmodes .vmode{flex:0 1 auto;max-width:100%}

  /* --- 需求4：整个输入卡片统一高度 ---
     所有页面（图片/视频/音频/设定图/故事板）的 .inputbox 固定同一高度，
     参数行多的内容在 .sheetbody 内部滚动，卡片本身不再因参数行数量而高矮不一。 */
  .composer .inputbox,
  .composer.ext .inputbox{height:300px;max-height:300px;min-height:0}
  .composer .inputbox .sheetbody,
  .composer.ext .inputbox .sheetbody{flex:1 1 auto;min-height:0;max-height:none;overflow-y:auto}
  /* 画布节点不在 .composer 内，同样统一整个卡片高度 */
  .cnode .cgen-stack .inputbox{height:300px;max-height:300px;min-height:0}
  .cnode .cgen-stack .inputbox .sheetbody{flex:1 1 auto;min-height:0;max-height:none;overflow-y:auto}
}
</style>
